<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#333;
line-height:1.6;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}

header h1{
font-size:40px;
}

header p{
font-size:18px;
margin-top:8px;
}

nav{
background:#222;
display:flex;
justify-content:center;
flex-wrap:wrap;
padding:15px;
}

nav a{
color:white;
text-decoration:none;
padding:10px 15px;
font-weight:bold;
}

nav a:hover{
background:#0a4ea3;
border-radius:5px;
}

.search-box{
text-align:center;
padding:15px;
background:white;
}

.search-box input{
width:80%;
max-width:500px;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.hero{
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5));
height:420px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero-content{
max-width:800px;
}

.hero h2{
font-size:42px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
margin-bottom:25px;
}

.button{
display:inline-block;
background:#0a4ea3;
color:white;
padding:15px 30px;
text-decoration:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
}

.button:hover{
background:#083b7a;
}

section{
padding:60px 20px;
max-width:1200px;
margin:auto;
}

.section-title{
text-align:center;
font-size:34px;
color:#0a4ea3;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
margin-bottom:15px;
}

.card h3{
color:#0a4ea3;
margin-bottom:10px;
}

.card p{
font-size:15px;
}

footer{
background:#0a4ea3;
color:white;
text-align:center;
padding:25px;
margin-top:50px;
}

</style>

</head>
