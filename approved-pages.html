<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approved Pages - Logical World</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

.top-link{
display:block;
width:max-content;
margin:0 auto 25px;
background:#0a4ea3;
color:white;
padding:10px 18px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

#approvedPagesList{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:20px;
max-width:1000px;
margin:auto;
}

.business-card{
background:white;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.18);
}

.business-link{
display:block;
text-decoration:none;
color:inherit;
cursor:pointer;
}

.business-logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:3px solid #0a4ea3;
background:#eee;
transition:transform .2s;
cursor:zoom-in;
}

.business-logo:hover{
transform:scale(1.04);
}

.business-name{
font-size:21px;
font-weight:bold;
color:#0a4ea3;
margin:0;
}

.tap-text{
font-size:13px;
color:#777;
margin-top:7px;
}

.admin-controls{
margin-top:15px;
padding-top:12px;
border-top:1px solid #ddd;
}

.admin-btn{
width:100%;
padding:11px;
border:0;
border-radius:6px;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:8px;
}

.reject-btn{
background:#f57c00;
}

.reject-btn:hover{
background:#c65f00;
}

.delete-btn{
background:#d32f2f;
}

.delete-btn:hover{
background:#a91f1f;
}

.loading{
text-align:center;
color:#666;
grid-column:1/-1;
padding:30px;
}

.empty{
text-align:center;
color:#666;
grid-column:1/-1;
padding:30px;
}

.admin-badge{
display:none;
text-align:center;
background:#e8f5e9;
color:#18752a;
padding:10px;
border-radius:6px;
max-width:500px;
margin:0 auto 20px;
font-weight:bold;
}


/* =========================
   FULL SIZE IMAGE VIEWER
========================= */

.image-viewer{
display:none;
position:fixed;
z-index:9999;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.92);
justify-content:center;
align-items:center;
padding:20px;
}

.image-viewer img{
max-width:95%;
max-height:90%;
object-fit:contain;
border-radius:8px;
}

.close-viewer{
position:absolute;
top:15px;
right:20px;
color:white;
font-size:40px;
font-weight:bold;
cursor:pointer;
line-height:1;
}

.close-viewer:hover{
color:#ccc;
}

@media(max-width:500px){

#approvedPagesList{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.business-card{
padding:12px;
}

.business-logo{
width:110px;
height:110px;
}

.business-name{
font-size:17px;
}

}

</style>

</head>


<body>


<h1>
✅ Approved Pages
</h1>

<p class="subtitle">
Explore approved pages on Logical World
</p>


<a
href="admin.html"
id="adminDashboardLink"
class="top-link"
style="display:none;"
>
⚙️ Admin Dashboard
</a>


<div
id="adminBadge"
class="admin-badge"
>
🔐 Admin Mode — Page management enabled
</div>


<div
id="approvedPagesList"
>

<div class="loading">
Loading approved pages...
</div>

</div>


<!-- =========================
     FULL SIZE IMAGE VIEWER
========================= -->

<div
id="imageViewer"
class="image-viewer"
>

<span
id="closeViewer"
class="close-viewer"
>
&times;
</span>

<img
id="fullSizeImage"
src=""
alt="Full Size Logo"
>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
getDocs,
addDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
"alagoagodstime@gmail.com";


/* =========================
   ELEMENTS
========================= */

const approvedPagesList =
document.getElementById(
"approvedPagesList"
);

const adminDashboardLink =
document.getElementById(
"adminDashboardLink"
);

const adminBadge =
document.getElementById(
"adminBadge"
);

const imageViewer =
document.getElementById(
"imageViewer"
);

const fullSizeImage =
document.getElementById(
"fullSizeImage"
);

const closeViewer =
document.getElementById(
"closeViewer"
);


/* =========================
   ADMIN STATE
========================= */

let isAdmin = false;


/* =========================
   IMAGE VIEWER
========================= */

function openFullSizeImage(
imageURL
){

fullSizeImage.src =
imageURL;

imageViewer.style.display =
"flex";

}


function closeFullSizeImage(){

imageViewer.style.display =
"none";

fullSizeImage.src =
"";

}


closeViewer.addEventListener(
"click",
closeFullSizeImage
);


imageViewer.addEventListener(
"click",
(event)=>{

if(
event.target ===
imageViewer
){

closeFullSizeImage();

}

});


document.addEventListener(
"keydown",
(event)=>{

if(
event.key === "Escape"
){

closeFullSizeImage();

}

});


/* =========================
   CHECK LOGIN
========================= */

onAuthStateChanged(
auth,
(user)=>{

if(
user &&
user.email ===
ADMIN_EMAIL
){

isAdmin = true;

adminDashboardLink.style.display =
"block";

adminBadge.style.display =
"block";

}else{

isAdmin = false;

adminDashboardLink.style.display =
"none";

adminBadge.style.display =
"none";

}


loadApprovedPages();

}
);


/* =========================
   LOAD APPROVED PAGES
========================= */

async function loadApprovedPages(){

approvedPagesList.innerHTML = `

<div class="loading">
Loading approved pages...
</div>

`;


try{

const snapshot =
await getDocs(

collection(
db,
"approvedPages"
)

);


approvedPagesList.innerHTML = "";


if(
snapshot.empty
){

approvedPagesList.innerHTML = `

<div class="empty">

No approved pages yet.

</div>

`;

return;

}


snapshot.forEach(
(page)=>{

const data =
page.data();

const pageId =
page.id;


const pageName =
data.pageName ||
"Business";


const logoURL =
data.logoURL ||
"images/default-logo.png";


const businessURL =
"business.html?id=" +
encodeURIComponent(
pageId
);


/* =========================
   CARD
========================= */

const card =
document.createElement(
"div"
);

card.className =
"business-card";


/* =========================
   PUBLIC PAGE LINK
========================= */

const link =
document.createElement(
"a"
);

link.className =
"business-link";

link.href =
businessURL;


/* =========================
   LOGO
========================= */

const logo =
document.createElement(
"img"
);

logo.className =
"business-logo";

logo.src =
logoURL;

logo.alt =
pageName;


/*
   Clicking the logo opens
   the full-size image.
*/

logo.addEventListener(
"click",
(event)=>{

event.preventDefault();
event.stopPropagation();

openFullSizeImage(
logoURL
);

}
);


/* =========================
   NAME
========================= */

const name =
document.createElement(
"p"
);

name.className =
"business-name";

name.textContent =
pageName;


/* =========================
   TAP MESSAGE
========================= */

const tapText =
document.createElement(
"div"
);

tapText.className =
"tap-text";

tapText.textContent =
"Tap page to view posts • Tap logo to enlarge";


link.appendChild(
logo
);

link.appendChild(
name
);

link.appendChild(
tapText
);

card.appendChild(
link
);


/* =========================
   ADMIN CONTROLS
========================= */

if(isAdmin){

const controls =
document.createElement(
"div"
);

controls.className =
"admin-controls";


/* =========================
   REJECT BUTTON
========================= */

const rejectButton =
document.createElement(
"button"
);

rejectButton.className =
"admin-btn reject-btn";

rejectButton.textContent =
"🚫 Reject Approved Page";


rejectButton.addEventListener(
"click",
async(event)=>{

event.preventDefault();
event.stopPropagation();


const reason =
prompt(
"Enter the reason for rejecting this page:"
);


if(
reason === null
){

return;

}


if(
reason.trim() === ""
){

alert(
"Please enter a rejection reason."
);

return;

}


const confirmed =
confirm(

"Reject \"" +
pageName +
"\"?\n\n" +
"Reason: " +
reason

);


if(!confirmed){

return;

}


try{

rejectButton.disabled =
true;

rejectButton.textContent =
"Rejecting...";


/* =========================
   SAVE TO REJECTED
========================= */

const rejectedData = {

...data,

status:
"Rejected",

rejectionReason:
reason.trim(),

rejectedAt:
serverTimestamp(),

previousApprovedPageId:
pageId

};


await addDoc(

collection(
db,
"rejectedPages"
),

rejectedData

);


/* =========================
   DELETE FROM APPROVED
========================= */

await deleteDoc(

doc(
db,
"approvedPages",
pageId
)

);


alert(
"Page rejected successfully."
);


await loadApprovedPages();


}catch(error){

console.error(
"Reject page error:",
error
);


alert(
"Reject failed: " +
error.message
);


rejectButton.disabled =
false;

rejectButton.textContent =
"🚫 Reject Approved Page";

}

});


controls.appendChild(
rejectButton
);


/* =========================
   DELETE BUTTON
========================= */

const deleteButton =
document.createElement(
"button"
);

deleteButton.className =
"admin-btn delete-btn";

deleteButton.textContent =
"🗑 Delete Approved Page";


deleteButton.addEventListener(
"click",
async(event)=>{

event.preventDefault();
event.stopPropagation();


const confirmed =
confirm(

"Delete \"" +
pageName +
"\" permanently?\n\n" +
"This will remove the approved page and its posts from Logical World."

);


if(!confirmed){

return;

}


try{

deleteButton.disabled =
true;

deleteButton.textContent =
"Deleting...";


/* =========================
   DELETE PAGE
========================= */

await deleteDoc(

doc(
db,
"approvedPages",
pageId
)

);


/* =========================
   DELETE POSTS
========================= */

const postsSnapshot =
await getDocs(

collection(
db,
"posts"
)

);


for(
const post of
postsSnapshot.docs
){

const postData =
post.data();


if(
postData.pageId ===
pageId
){

await deleteDoc(

doc(
db,
"posts",
post.id
)

);

}

}


alert(
"Approved page deleted successfully."
);


await loadApprovedPages();


}catch(error){

console.error(
"Delete approved page error:",
error
);


alert(
"Delete failed: " +
error.message
);


deleteButton.disabled =
false;

deleteButton.textContent =
"🗑 Delete Approved Page";

}

});


controls.appendChild(
deleteButton
);

card.appendChild(
controls
);

}


approvedPagesList.appendChild(
card
);

});


}catch(error){

console.error(
"Error loading approved pages:",
error
);


approvedPagesList.innerHTML = `

<div class="empty">

Unable to load approved pages.

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* =========================
   HELPER
========================= */

function escapeHTML(
value
){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>


</body>
   </html>
