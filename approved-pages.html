<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approved Pages - Logical World</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
color:#222;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
margin:-20px -20px 25px;
}

header h1{
margin:0 0 8px;
}

header p{
margin:0;
}

.top-buttons{
text-align:center;
margin-bottom:25px;
}

.top-buttons a{
display:inline-block;
text-decoration:none;
background:#0a4ea3;
color:white;
padding:11px 18px;
border-radius:6px;
margin:5px;
font-weight:bold;
}

.top-buttons a:hover{
background:#083d82;
}

#searchApproved{
display:block;
width:100%;
max-width:700px;
margin:0 auto 25px;
padding:13px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
}

#approvedPagesList{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1100px;
margin:auto;
}


/* =========================
   BUSINESS CARD
========================= */

.business-card{
background:white;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.18);
}


/* =========================
   CLICKABLE PAGE
========================= */

.business-link{
display:block;
text-decoration:none;
color:inherit;
cursor:pointer;
}


/* =========================
   BUSINESS LOGO
========================= */

.business-logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:3px solid #0a4ea3;
background:#eee;
transition:transform .2s;
}

.business-logo:hover{
transform:scale(1.04);
}


/* =========================
   BUSINESS NAME
========================= */

.business-name{
font-size:21px;
font-weight:bold;
color:#0a4ea3;
margin:0;
}


/* =========================
   DETAILS
========================= */

.page-details{
text-align:left;
margin-top:15px;
padding-top:15px;
border-top:1px solid #ddd;
}

.page-details p{
margin:7px 0;
font-size:14px;
}


/* =========================
   DELETE BUTTON
========================= */

.delete-approved{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:7px;
background:#b00020;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.delete-approved:hover{
background:#850018;
}


/* =========================
   STATUS
========================= */

.admin-label{
display:none;
background:#fff3cd;
color:#856404;
padding:10px;
border-radius:6px;
margin:0 auto 20px;
max-width:700px;
text-align:center;
font-weight:bold;
}


/* =========================
   EMPTY / LOADING
========================= */

.message{
text-align:center;
color:#666;
padding:30px;
grid-column:1/-1;
background:white;
border-radius:10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

#approvedPagesList{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.business-card{
padding:12px;
}

.business-logo{
width:110px;
height:110px;
}

.business-name{
font-size:17px;
}

.page-details p{
font-size:12px;
}

.delete-approved{
font-size:13px;
padding:10px;
}

}

</style>

</head>


<body>


<header>

<h1>
🌍 Logical World
</h1>

<p>
Approved Pages
</p>

</header>


<!-- =========================
     NAVIGATION
========================= -->

<div class="top-buttons">

<a href="admin.html">
🏠 Admin Dashboard
</a>

<a href="index.html">
🌍 Website Home
</a>

</div>


<!-- =========================
     ADMIN MESSAGE
========================= -->

<div
id="adminLabel"
class="admin-label"
>

🔐 Admin Mode — You can delete approved pages.

</div>


<!-- =========================
     SEARCH
========================= -->

<input
type="text"
id="searchApproved"
placeholder="🔍 Search approved pages..."
>


<!-- =========================
     APPROVED PAGES
========================= -->

<div id="approvedPagesList">

<div class="message">

Loading approved pages...

</div>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
getDocs,
deleteDoc,
doc,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
"alagoagodstime@gmail.com";


/* =========================
   ELEMENTS
========================= */

const approvedPagesList =
document.getElementById(
"approvedPagesList"
);

const searchApproved =
document.getElementById(
"searchApproved"
);

const adminLabel =
document.getElementById(
"adminLabel"
);


/* =========================
   DATA
========================= */

let allPages = [];

let isAdmin = false;


/* =========================
   CHECK LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{

isAdmin =
!!user &&
user.email ===
ADMIN_EMAIL;


if(isAdmin){

adminLabel.style.display =
"block";

}


await loadApprovedPages();

}
);


/* =========================
   LOAD APPROVED PAGES
========================= */

async function loadApprovedPages(){

approvedPagesList.innerHTML = `

<div class="message">

Loading approved pages...

</div>

`;


try{

const snapshot =
await getDocs(
collection(
db,
"approvedPages"
)
);


allPages =
snapshot.docs.map(
page=>({

id:page.id,

data:page.data()

})
);


displayPages(
allPages
);


}catch(error){

console.error(
"Approved pages error:",
error
);

approvedPagesList.innerHTML = `

<div class="message">

Unable to load approved pages.

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* =========================
   DISPLAY PAGES
========================= */

function displayPages(
pages
){

approvedPagesList.innerHTML = "";


if(pages.length === 0){

approvedPagesList.innerHTML = `

<div class="message">

No approved pages found.

</div>

`;

return;

}


pages.forEach(
(page)=>{

const data =
page.data;


const businessName =
data.pageName ||
"Business";


const logoURL =
data.logoURL ||
"images/default-logo.png";


const businessURL =
"business.html?id=" +
encodeURIComponent(
page.id
);


const card =
document.createElement(
"div"
);

card.className =
"business-card";


/* =========================
   PAGE CONTENT
========================= */

let html = `

<a
href="${businessURL}"
class="business-link"
>

<img
src="${escapeAttribute(logoURL)}"
class="business-logo"
alt="${escapeAttribute(businessName)}"
>

<p class="business-name">

${escapeHTML(
businessName
)}

</p>

</a>


<div class="page-details">

${
data.category
?
`
<p>
<strong>Category:</strong>
${escapeHTML(data.category)}
</p>
`
:
""
}


${
data.location
?
`
<p>
<strong>Location:</strong>
${escapeHTML(data.location)}
</p>
`
:
""
}


${
data.description
?
`
<p>
${escapeHTML(data.description)}
</p>
`
:
""
}

</div>

`;


/* =========================
   ADMIN DELETE BUTTON
========================= */

if(isAdmin){

html += `

<button
class="delete-approved"
data-id="${page.id}"
>

🗑️ Delete Approved Page

</button>

`;

}


card.innerHTML =
html;


approvedPagesList.appendChild(
card
);

});

}


/* =========================
   DELETE APPROVED PAGE
========================= */

document.addEventListener(
"click",
async(e)=>{

if(
!e.target.classList.contains(
"delete-approved"
)
){

return;

}


/* EXTRA ADMIN CHECK */

const user =
auth.currentUser;


if(
!user ||
user.email !==
ADMIN_EMAIL
){

alert(
"Only the Logical World Admin can delete approved pages."
);

return;

}


const pageId =
e.target.dataset.id;


if(!pageId){

return;

}


const confirmed =
confirm(

"Delete this approved page?\n\n" +
"This will also delete all posts belonging to this page."

);


if(!confirmed){

return;

}


try{

e.target.disabled =
true;

e.target.innerText =
"Deleting...";


/* =========================
   DELETE POSTS
========================= */

const postsQuery =
query(

collection(
db,
"posts"
),

where(
"pageId",
"==",
pageId
)

);


const postsSnapshot =
await getDocs(
postsQuery
);


for(
const post of postsSnapshot.docs
){

await deleteDoc(
doc(
db,
"posts",
post.id
)
);

}


/* =========================
   DELETE APPROVED PAGE
========================= */

await deleteDoc(

doc(
db,
"approvedPages",
pageId
)

);


alert(
"Approved page deleted successfully."
);


/* RELOAD */

await loadApprovedPages();


}catch(error){

console.error(
"Delete approved page error:",
error
);

alert(
"Delete failed: " +
error.message
);


e.target.disabled =
false;

e.target.innerText =
"🗑️ Delete Approved Page";

}

});


/* =========================
   SEARCH
========================= */

searchApproved.addEventListener(
"input",
()=>{

const search =
searchApproved.value
.trim()
.toLowerCase();


if(!search){

displayPages(
allPages
);

return;

}


const filtered =
allPages.filter(
page=>{

const data =
page.data;


return (

String(
data.pageName || ""
)
.toLowerCase()
.includes(search)

||

String(
data.category || ""
)
.toLowerCase()
.includes(search)

||

String(
data.location || ""
)
.toLowerCase()
.includes(search)

||

String(
data.description || ""
)
.toLowerCase()
.includes(search)

);

}
);


displayPages(
filtered
);

});


/* =========================
   HELPERS
========================= */

function escapeHTML(
value
){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(
value
){

return escapeHTML(
value
);

}

</script>


</body>

  </html>
