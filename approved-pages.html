<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Approved Business Pages - Logical World</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#555;
margin-bottom:25px;
}


/* BUSINESS LIST */

#approvedPagesList{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
max-width:1100px;
margin:auto;
}


/* FACEBOOK STYLE BUSINESS CARD */

.card{
background:white;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.18);
overflow:hidden;
text-align:center;
transition:transform .2s,box-shadow .2s;
}

.card:hover{
transform:translateY(-3px);
box-shadow:0 5px 18px rgba(0,0,0,.22);
}


/* CLICKABLE BUSINESS AREA */

.businessLink{
display:block;
text-decoration:none;
color:inherit;
padding:20px 20px 10px;
cursor:pointer;
}


/* BUSINESS PROFILE IMAGE */

.page-logo{
width:130px;
height:130px;
display:block;
margin:0 auto 15px;
border-radius:50%;
object-fit:cover;
border:3px solid #0a4ea3;
background:#eee;
}


/* BUSINESS NAME */

.page-name{
font-size:22px;
color:#0a4ea3;
margin:10px 0;
}


/* INFORMATION */

.category{
font-weight:bold;
color:#333;
margin:8px 0;
}

.description{
color:#555;
line-height:1.5;
}

.location{
color:#555;
margin-top:10px;
}


/* VIEW BUTTON */

.view{
display:inline-block;
padding:12px 22px;
margin:15px 5px 20px;
border:none;
border-radius:6px;
background:#0a4ea3;
color:white;
font-size:16px;
font-weight:bold;
text-decoration:none;
cursor:pointer;
}

.view:hover{
background:#083d82;
}


/* EMPTY MESSAGE */

.empty{
text-align:center;
font-size:18px;
color:#666;
padding:30px;
}

</style>

</head>

<body>


<h1>Approved Business Pages</h1>

<p class="subtitle">
Discover businesses and services on Logical World
</p>


<div id="approvedPagesList"></div>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const approvedPagesList =
document.getElementById("approvedPagesList");


/* =========================
   LOAD APPROVED PAGES
========================= */

try{

const snapshot =
await getDocs(
collection(db,"approvedPages")
);


if(snapshot.empty){

approvedPagesList.innerHTML = `
<div class="empty">
No approved business pages yet.
</div>
`;

}else{


snapshot.forEach((page)=>{

const data =
page.data();


/* BUSINESS ID */

const businessURL =
"business.html?id=" +
encodeURIComponent(page.id);


/* LOGO */

const logo =
data.logoURL
?
data.logoURL
:
"images/default-logo.png";


/* BUSINESS NAME */

const name =
data.pageName ||
"Business";


/* CARD */

approvedPagesList.innerHTML += `

<div class="card">

<a
href="${businessURL}"
class="businessLink"
>

<img
src="${logo}"
class="page-logo"
alt="${name}"
>

<h2 class="page-name">
${name}
</h2>

<p class="category">
Category:
${data.category || "Other"}
</p>

<p class="description">
${data.description || ""}
</p>

<p class="location">
<strong>Location:</strong>
${data.location || ""}
</p>

</a>


<a
href="${businessURL}"
class="view"
>
👁 View Business
</a>


</div>

`;

});

}

}catch(error){

console.error(
"Error loading approved pages:",
error
);

approvedPagesList.innerHTML = `
<div class="empty">
Unable to load business pages.
<br><br>
Please try again.
</div>
`;

}

</script>


</body>
   </html>
