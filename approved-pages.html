<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approved Pages - Logical World</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

.top-link{
display:block;
width:max-content;
margin:0 auto 25px;
background:#0a4ea3;
color:white;
padding:10px 18px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

#approvedPagesList{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:20px;
max-width:1000px;
margin:auto;
}

.business-card{
background:white;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.18);
}

.business-link{
display:block;
text-decoration:none;
color:inherit;
cursor:pointer;
}

.business-logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:3px solid #0a4ea3;
background:#eee;
transition:transform .2s;
}

.business-logo:hover{
transform:scale(1.04);
}

.business-name{
font-size:21px;
font-weight:bold;
color:#0a4ea3;
margin:0;
}

.tap-text{
font-size:13px;
color:#777;
margin-top:7px;
}

.admin-controls{
margin-top:15px;
padding-top:12px;
border-top:1px solid #ddd;
}

.delete-btn{
width:100%;
padding:11px;
border:0;
border-radius:6px;
background:#d32f2f;
color:white;
font-weight:bold;
cursor:pointer;
}

.delete-btn:hover{
background:#a91f1f;
}

.loading{
text-align:center;
color:#666;
grid-column:1/-1;
padding:30px;
}

.empty{
text-align:center;
color:#666;
grid-column:1/-1;
padding:30px;
}

.admin-badge{
display:none;
text-align:center;
background:#e8f5e9;
color:#18752a;
padding:10px;
border-radius:6px;
max-width:500px;
margin:0 auto 20px;
font-weight:bold;
}

@media(max-width:500px){

#approvedPagesList{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.business-card{
padding:12px;
}

.business-logo{
width:110px;
height:110px;
}

.business-name{
font-size:17px;
}

}

</style>

</head>

<body>


<h1>
✅ Approved Pages
</h1>

<p class="subtitle">
Explore approved pages on Logical World
</p>


<a
href="admin.html"
id="adminDashboardLink"
class="top-link"
style="display:none;"
>
⚙️ Admin Dashboard
</a>


<div
id="adminBadge"
class="admin-badge"
>
🔐 Admin Mode — Page management enabled
</div>


<div
id="approvedPagesList"
>

<div class="loading">
Loading approved pages...
</div>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
getDocs,
deleteDoc,
doc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
"alagoagodstime@gmail.com";


/* =========================
   ELEMENTS
========================= */

const approvedPagesList =
document.getElementById(
"approvedPagesList"
);

const adminDashboardLink =
document.getElementById(
"adminDashboardLink"
);

const adminBadge =
document.getElementById(
"adminBadge"
);


/* =========================
   ADMIN STATE
========================= */

let isAdmin = false;


/* =========================
   CHECK LOGIN
========================= */

onAuthStateChanged(
auth,
(user)=>{

if(
user &&
user.email ===
ADMIN_EMAIL
){

isAdmin = true;

adminDashboardLink.style.display =
"block";

adminBadge.style.display =
"block";

}else{

isAdmin = false;

adminDashboardLink.style.display =
"none";

adminBadge.style.display =
"none";

}


loadApprovedPages();

}
);


/* =========================
   LOAD APPROVED PAGES
========================= */

async function loadApprovedPages(){

approvedPagesList.innerHTML = `

<div class="loading">
Loading approved pages...
</div>

`;


try{

const snapshot =
await getDocs(

collection(
db,
"approvedPages"
)

);


approvedPagesList.innerHTML = "";


if(
snapshot.empty
){

approvedPagesList.innerHTML = `

<div class="empty">

No approved pages yet.

</div>

`;

return;

}


snapshot.forEach(
(page)=>{

const data =
page.data();

const pageId =
page.id;


const pageName =
data.pageName ||
"Business";


const logoURL =
data.logoURL ||
"images/default-logo.png";


const businessURL =
"business.html?id=" +
encodeURIComponent(
pageId
);


/* =========================
   CARD
========================= */

const card =
document.createElement(
"div"
);

card.className =
"business-card";


/* =========================
   PUBLIC PAGE LINK
========================= */

const link =
document.createElement(
"a"
);

link.className =
"business-link";

link.href =
businessURL;


/* LOGO */

const logo =
document.createElement(
"img"
);

logo.className =
"business-logo";

logo.src =
logoURL;

logo.alt =
pageName;


/* NAME */

const name =
document.createElement(
"p"
);

name.className =
"business-name";

name.textContent =
pageName;


/* TAP MESSAGE */

const tapText =
document.createElement(
"div"
);

tapText.className =
"tap-text";

tapText.textContent =
"Tap to view page and posts";


link.appendChild(
logo
);

link.appendChild(
name
);

link.appendChild(
tapText
);

card.appendChild(
link
);


/* =========================
   ADMIN DELETE
========================= */

if(isAdmin){

const controls =
document.createElement(
"div"
);

controls.className =
"admin-controls";


const deleteButton =
document.createElement(
"button"
);

deleteButton.className =
"delete-btn";

deleteButton.textContent =
"🗑 Delete Approved Page";


deleteButton.addEventListener(
"click",
async(event)=>{

event.preventDefault();

event.stopPropagation();


const confirmed =
confirm(

"Delete \"" +
pageName +
"\" permanently?\n\n" +
"This will remove the approved page and its posts from Logical World."

);


if(!confirmed){

return;

}


try{

deleteButton.disabled =
true;

deleteButton.textContent =
"Deleting...";


/* =========================
   DELETE PAGE
========================= */

await deleteDoc(

doc(
db,
"approvedPages",
pageId
)

);


/* =========================
   DELETE POSTS
========================= */

const postsSnapshot =
await getDocs(

collection(
db,
"posts"
)

);


for(
const post of
postsSnapshot.docs
){

const postData =
post.data();


if(
postData.pageId ===
pageId
){

await deleteDoc(

doc(
db,
"posts",
post.id
)

);

}

}


alert(
"Approved page deleted successfully."
);


await loadApprovedPages();


}catch(error){

console.error(
"Delete approved page error:",
error
);


alert(
"Delete failed: " +
error.message
);


deleteButton.disabled =
false;

deleteButton.textContent =
"🗑 Delete Approved Page";

}

});


controls.appendChild(
deleteButton
);

card.appendChild(
controls
);

}


approvedPagesList.appendChild(
card
);

});


}catch(error){

console.error(
"Error loading approved pages:",
error
);


approvedPagesList.innerHTML = `

<div class="empty">

Unable to load approved pages.

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* =========================
   HELPER
========================= */

function escapeHTML(
value
){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>

</body>

   </html>
