<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approved Business Pages - Logical World</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:30px;
}

#approvedPagesList{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
max-width:900px;
margin:auto;
}


/* BUSINESS CARD */

.business-card{
background:white;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.18);
}


/* CLICKABLE AREA */

.business-link{
display:block;
text-decoration:none;
color:inherit;
cursor:pointer;
}


/* BUSINESS LOGO */

.business-logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:3px solid #0a4ea3;
background:#eee;
transition:transform .2s;
}

.business-logo:hover{
transform:scale(1.04);
}


/* BUSINESS NAME */

.business-name{
font-size:21px;
font-weight:bold;
color:#0a4ea3;
margin:0;
}


/* MOBILE */

@media(max-width:500px){

#approvedPagesList{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.business-card{
padding:12px;
}

.business-logo{
width:110px;
height:110px;
}

.business-name{
font-size:17px;
}

}

</style>

</head>

<body>


<h1>Approved Business Pages</h1>


<div id="approvedPagesList"></div>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const approvedPagesList =
document.getElementById("approvedPagesList");


try{

const snapshot =
await getDocs(
collection(db,"approvedPages")
);


snapshot.forEach((page)=>{

const data =
page.data();


const businessName =
data.pageName || "Business";


const logoURL =
data.logoURL ||
"images/default-logo.png";


const businessURL =
"business.html?id=" +
encodeURIComponent(page.id);


/* BUSINESS CARD */

approvedPagesList.innerHTML += `

<div class="business-card">

<a
href="${businessURL}"
class="business-link"
>

<img
src="${logoURL}"
class="business-logo"
alt="${businessName}"
>

<p class="business-name">
${businessName}
</p>

</a>

</div>

`;

});


}catch(error){

console.error(
"Error loading approved businesses:",
error
);

approvedPagesList.innerHTML = `

<p style="
text-align:center;
color:#666;
grid-column:1/-1;
">

Unable to load approved business pages.

</p>

`;

}

</script>


</body>
</html>
