<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logical World - Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
padding:30px;
width:90%;
max-width:450px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#0a4ea3;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#083b7a;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#0a4ea3;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<form id="registerForm">

<input
type="text"
id="fullname"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">
Create Account
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
  </p>
  <div id="message"
style="
margin-top:15px;
text-align:center;
font-weight:bold;
color:#0a4ea3;
">
</div>

</div>

<script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLdWY7gbNmLOc-jCoQ27FIW9iBzVtbwhk",
  authDomain: "official-website-b2757.firebaseapp.com",
  projectId: "official-website-b2757",
  storageBucket: "official-website-b2757.firebasestorage.app",
  messagingSenderId: "295891219037",
  appId: "1:295891219037:web:c1b1713c9291f88cabd3b4",
  measurementId: "G-T0BKW67381"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const fullname = document.getElementById("fullname").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.style.color = "red";
    message.innerHTML = "Passwords do not match.";
    return;
  }

  try {

    await createUserWithEmailAndPassword(auth, email, password);

    message.style.color = "green";
    message.innerHTML = "Account created successfully!";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);

  } catch (error) {

    message.style.color = "red";
    message.innerHTML = error.message;

  }

});

</script>
  </script>

</body>

</html>
