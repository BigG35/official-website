<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logical World - Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
padding:30px;
width:90%;
max-width:450px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#0a4ea3;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#083b7a;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#0a4ea3;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<form id="registerForm">

<input
type="text"
id="fullname"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">
Create Account
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
  </p>
  <div id="message"
style="
margin-top:15px;
text-align:center;
font-weight:bold;
color:#0a4ea3;
">
</div>

</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event){

event.preventDefault();

const fullname =
document.getElementById("fullname").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

if(password !== confirmPassword){

message.style.color="red";
message.innerHTML="Passwords do not match.";

return;

}

message.style.color="green";
message.innerHTML="Registration successful! Firebase connection will be added next.";

});
  </script>

</body>

</html>
