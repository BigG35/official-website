<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Approved Pages</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#0a4ea3;
}

#approvedPagesList{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

button{
padding:10px 15px;
border:none;
border-radius:5px;
margin:5px;
cursor:pointer;
font-weight:bold;
}

.view{
background:#0a4ea3;
color:white;
}

.delete{
background:red;
color:white;
}

</style>

</head>

<body>

<h1>Approved Business Pages</h1>

<div id="approvedPagesList"></div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const approvedPagesList =
document.getElementById("approvedPagesList");

const snapshot =
await getDocs(collection(db,"approvedPages"));

snapshot.forEach((page)=>{

const data = page.data();

approvedPagesList.innerHTML += `

<div class="card">

<h2>${data.pageName}</h2>

<p><strong>Category:</strong> ${data.category}</p>

<p>${data.description}</p>

<p><strong>Location:</strong> ${data.location}</p>

<button class="view"
onclick="location.href='business.html?id=${page.id}'">

👁 View

</button>

<button class="delete"
data-id="${page.id}">

🗑 Delete

</button>

</div>

`;

});

document.addEventListener("click",async(e)=>{

if(e.target.classList.contains("delete")){

const id=e.target.dataset.id;

if(confirm("Delete this approved page?")){

await deleteDoc(doc(db,"approvedPages",id));

alert("Approved page deleted.");

location.reload();

}

}

});

</script>

</body>
</html>
