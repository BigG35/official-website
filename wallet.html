<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Logical World Wallet</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f6f9;
color:#222
}

.header{
background:#111827;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold
}

.container{
max-width:700px;
margin:auto;
padding:15px
}

.card{
background:white;
border-radius:14px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

h2{
margin-top:0;
font-size:19px
}

label{
display:block;
margin-top:12px;
margin-bottom:5px;
font-weight:bold
}

input,select,button{
width:100%;
padding:13px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px
}

button{
border:0;
background:#111827;
color:white;
font-weight:bold;
margin-top:15px;
cursor:pointer
}

button:disabled{
opacity:.6
}

.balance{
font-size:30px;
font-weight:bold;
margin:10px 0;
color:#087f23
}

.small{
font-size:13px;
color:#666
}

.message{
padding:12px;
border-radius:8px;
margin-top:12px;
display:none
}

.success{
background:#e8f7ed;
color:#087f23
}

.error{
background:#fdecec;
color:#b00020
}

.transaction{
border-bottom:1px solid #eee;
padding:12px 0
}

.transaction:last-child{
border-bottom:0
}

.transaction-title{
font-weight:bold
}

.transaction-meta{
font-size:13px;
color:#666;
margin-top:4px
}

.network-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

@media(max-width:480px){
.network-row{
grid-template-columns:1fr
}
}
</style></head><body><div class="header">
Logical World Wallet
</div><div class="container"><div class="card">
<h2>My Wallet</h2>
<div class="small">Current wallet balance</div>
<div class="balance" id="walletBalance">₦0.00</div>
<div class="small" id="walletStatus">Checking wallet...</div>
</div><div class="card">
<h2>Wallet Account</h2><label>Account Name</label>
<input id="accountName" type="text" placeholder="Your name">

<label>Phone Number</label>
<input id="accountPhone" type="tel" placeholder="08012345678">

<button id="registerWalletBtn">
Create / Update Wallet
</button><div id="walletMessage" class="message"></div>
</div><div class="card">
<h2>Add Money</h2><p class="small">
Add money to your Logical World wallet.
</p><label>Amount</label>
<input id="fundAmount" type="number" min="100" placeholder="₦1000">

<button id="fundBtn">
Add Money
</button><div id="fundMessage" class="message"></div>
</div><div class="card">
<h2>Buy Airtime</h2><p class="small">
Airtime purchases use your Logical World wallet balance.
</p><div class="network-row"><div>
<label>Network</label><select id="network">
<option value="">Select Network</option>
<option value="9mobile">9mobile</option>
<option value="airtel">Airtel</option>
<option value="glo">Glo</option>
<option value="mtn">MTN</option>
</select>
</div><div>
<label>Amount</label>
<input id="airtimeAmount" type="number" min="50" placeholder="₦100">
</div></div><label>Phone Number</label>
<input id="airtimePhone" type="tel" maxlength="11" placeholder="08012345678">

<button id="buyAirtimeBtn">
Buy Airtime
</button><div id="airtimeMessage" class="message"></div>
</div><div class="card">
<h2>Transaction History</h2><div id="transactions">
<div class="small">
Loading transactions...
</div>
</div></div></div><script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
where,
getDocs,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {
apiKey:"AIzaSyDLdWY7gbNmLOc-jCoQ27FIW9iBzVtbwhk",
authDomain:"official-website-b2757.firebaseapp.com",
projectId:"official-website-b2757",
storageBucket:"official-website-b2757.firebasestorage.app",
messagingSenderId:"295891219037",
appId:"1:295891219037:web:c1b1713c9291f88cabd3b4",
measurementId:"G-T0BKW67381"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


const VTUGATE_WORKER =
"https://logical-world-vtu.alagoagodstime.workers.dev";

const PAYSTACK_WORKER =
"https://logical-world-paystack.alagoagodstime.workers.dev";


let currentUser = null;
let currentWallet = null;


const $ = id => document.getElementById(id);


function showMessage(id,text,type){

const el = $(id);

el.textContent = text;

el.className = "message " + type;

el.style.display = "block";

}


function hideMessage(id){

const el = $(id);

el.style.display = "none";

}


function money(value){

return "₦" + Number(value || 0).toFixed(2);

}


async function loadWallet(){

if(!currentUser) return;

try{

const ref = doc(db,"users",currentUser.uid);

const snap = await getDoc(ref);


if(!snap.exists()){

currentWallet = null;

$("walletBalance").textContent = "₦0.00";

$("walletStatus").textContent =
"Wallet account has not been created.";

return;

}


currentWallet = snap.data();


$("accountName").value =
currentWallet.walletAccountName ||
currentUser.displayName ||
"";


$("accountPhone").value =
currentWallet.walletPhoneNumber ||
"";


$("walletBalance").textContent =
money(currentWallet.walletBalance);


$("walletStatus").textContent =
currentWallet.walletRegistered
? "Wallet active"
: "Wallet account not registered";


}catch(error){

$("walletStatus").textContent =
"Unable to load wallet.";

console.error("Wallet loading error:",error);

}

}


async function loadTransactions(){

if(!currentUser){

$("transactions").innerHTML =
'<div class="small">Please log in to view transactions.</div>';

return;

}


try{

const q = query(
collection(db,"walletTransactions"),
where("userId","==",currentUser.uid)
);


const snap = await getDocs(q);

let rows = [];


snap.forEach(d => {

rows.push({
id:d.id,
...d.data()
});

});


rows.sort((a,b)=>{

const at = a.createdAt?.seconds || 0;
const bt = b.createdAt?.seconds || 0;

return bt - at;

});


rows = rows.slice(0,30);


if(!rows.length){

$("transactions").innerHTML =
'<div class="small">No transactions yet.</div>';

return;

}


let html = "";


rows.forEach(t=>{

let date = "";


if(t.createdAt?.seconds){

date = new Date(
t.createdAt.seconds * 1000
).toLocaleString();

}else if(t.createdAt){

date = new Date(
t.createdAt
).toLocaleString();

}


html +=
'<div class="transaction">' +

'<div class="transaction-title">' +
(t.type || "Transaction") +
"</div>" +

"<div>" +
(t.description || "") +
"</div>" +

'<div class="transaction-meta">' +
"Amount: " +
money(t.amount) +
"</div>" +

(t.network
?
'<div class="transaction-meta">' +
"Network: " +
t.network +
"</div>"
:
"") +

(t.phoneNumber
?
'<div class="transaction-meta">' +
"Phone: " +
t.phoneNumber +
"</div>"
:
"") +

(t.transactionId
?
'<div class="transaction-meta">' +
"Transaction ID: " +
t.transactionId +
"</div>"
:
"") +

(t.status
?
'<div class="transaction-meta">' +
"Status: " +
t.status +
"</div>"
:
"") +

(date
?
'<div class="transaction-meta">' +
date +
"</div>"
:
"") +

"</div>";

});


$("transactions").innerHTML = html;


}catch(error){

console.error(
"Transaction loading error:",
error
);

$("transactions").innerHTML =
'<div class="small">' +
"Unable to load transaction history." +
"</div>";

}

}


$("registerWalletBtn").addEventListener(
"click",
async()=>{

hideMessage("walletMessage");


if(!currentUser){

showMessage(
"walletMessage",
"Please log in first.",
"error"
);

return;

}


const name =
$("accountName").value.trim();

const phone =
$("accountPhone").value.trim();


if(!name || !phone){

showMessage(
"walletMessage",
"Enter your name and phone number.",
"error"
);

return;

}


if(!/^[0-9]{11}$/.test(phone)){

showMessage(
"walletMessage",
"Enter an 11-digit Nigerian phone number.",
"error"
);

return;

}


const btn =
$("registerWalletBtn");


btn.disabled = true;
btn.textContent = "Saving...";


try{

const ref =
doc(db,"users",currentUser.uid);


const old =
await getDoc(ref);


const oldData =
old.exists()
? old.data()
: {};


await setDoc(
ref,
{
walletRegistered:true,

walletAccountName:name,

walletPhoneNumber:phone,

walletCurrency:"NGN",

walletStatus:"active",

walletAccountNumber:
oldData.walletAccountNumber ||
(
"LW" +
currentUser.uid
.substring(0,8)
.toUpperCase()
),

walletBalance:
Number(oldData.walletBalance || 0),

walletCreatedAt:
oldData.walletCreatedAt ||
serverTimestamp(),

walletUpdatedAt:
serverTimestamp()

},
{merge:true}
);


showMessage(
"walletMessage",
"Wallet account saved successfully.",
"success"
);


await loadWallet();


}catch(error){

console.error(
"Wallet save error:",
error
);


showMessage(
"walletMessage",
error.message ||
"Unable to save wallet.",
"error"
);

}


btn.disabled = false;
btn.textContent =
"Create / Update Wallet";

}
);


$("fundBtn").addEventListener(
"click",
async()=>{

hideMessage("fundMessage");


if(!currentUser){

showMessage(
"fundMessage",
"Please log in first.",
"error"
);

return;

}


const amount =
Number($("fundAmount").value);


if(
!Number.isFinite(amount) ||
amount < 100
){

showMessage(
"fundMessage",
"Enter an amount of at least ₦100.",
"error"
);

return;

}


const btn =
$("fundBtn");


btn.disabled = true;
btn.textContent =
"Connecting...";


try{

const idToken =
await currentUser.getIdToken();


const response =
await fetch(
PAYSTACK_WORKER,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
idToken:idToken,
amount:amount,
email:currentUser.email || ""
})

}
);


const result =
await response.json();


if(
!response.ok ||
result.status === false
){

throw new Error(
result.message ||
"Unable to start payment."
);

}


if(result.authorization_url){

window.location.href =
result.authorization_url;

return;

}


if(result.url){

window.location.href =
result.url;

return;

}


showMessage(
"fundMessage",
result.message ||
"Payment request created.",
"success"
);


}catch(error){

showMessage(
"fundMessage",
error.message ||
"Unable to start payment.",
"error"
);

}


btn.disabled = false;
btn.textContent =
"Add Money";

}
);


$("buyAirtimeBtn").addEventListener(
"click",
async()=>{

hideMessage("airtimeMessage");


if(!currentUser){

showMessage(
"airtimeMessage",
"Please log in first.",
"error"
);

return;

}


const network =
$("network").value;


const phone =
$("airtimePhone").value.trim();


const amount =
Number($("airtimeAmount").value);


if(!network){

showMessage(
"airtimeMessage",
"Select a network.",
"error"
);

return;

}


if(!/^[0-9]{11}$/.test(phone)){

showMessage(
"airtimeMessage",
"Enter a valid 11-digit phone number.",
"error"
);

return;

}


if(
!Number.isFinite(amount) ||
amount < 50
){

showMessage(
"airtimeMessage",
"Airtime amount must be at least ₦50.",
"error"
);

return;

}


const btn =
$("buyAirtimeBtn");


btn.disabled = true;
btn.textContent =
"Processing...";


try{

const idToken =
await currentUser.getIdToken();


const response =
await fetch(
VTUGATE_WORKER,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

idToken:idToken,

network:network,

phone_number:phone,

amount:amount

})

}
);


const result =
await response.json();


if(
!response.ok ||
!result.status
){

throw new Error(
result.message ||
"Airtime purchase failed."
);

}


$("walletBalance").textContent =
money(result.walletBalance);


$("walletStatus").textContent =
"Wallet active";


showMessage(
"airtimeMessage",

(
result.message ||
"Airtime purchase successful."
) +

" Your new wallet balance is " +

money(result.walletBalance) +

".",

"success"
);


await loadWallet();

await loadTransactions();


}catch(error){

console.error(
"Airtime purchase error:",
error
);


showMessage(
"airtimeMessage",
error.message ||
"Airtime purchase failed.",
"error"
);

}


btn.disabled = false;
btn.textContent =
"Buy Airtime";

}
);


onAuthStateChanged(
auth,
async user=>{

currentUser = user;


if(!user){

$("walletStatus").textContent =
"Please log in to use your wallet.";

$("transactions").innerHTML =
'<div class="small">' +
"Please log in to view transactions." +
"</div>";

return;

}


await loadWallet();

await loadTransactions();

}
);

</script></body>
</html>
