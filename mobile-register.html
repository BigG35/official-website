<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Logical World - Mobile Registration</title><style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f3f5f7;
color:#222;
}

.container{
max-width:480px;
margin:25px auto;
padding:15px;
}

.card{

border-radius:12px;
padding:22px;
box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.logo{

color:#0a4ea3;
font-size:25px;

margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:22px;
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:5px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
}

input:focus{
outline:none;
border-color:#0a4ea3;
}

button{
width:100%;
padding:13px;
border:0;
border-radius:7px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:18px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.primary{
background:#0a4ea3;
color:white;
}

.secondary{
background:#555;
color:white;
}

.status{
padding:12px;
border-radius:7px;
margin-top:15px;
display:none;
font-size:14px;
line-height:1.5;
}

.status.info{
display:block;
background:#eef5ff;
color:#0a4ea3;
border-left:4px solid #0a4ea3;
}

.status.success{
display:block;
background:#edf8ef;
color:#176b2c;
border-left:4px solid #2e8b57;
}

.status.error{
display:block;
background:#fff0f0;
color:#a00000;
border-left:4px solid #d32f2f;
}

.photo-preview{
display:block;
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
margin:12px auto;
border:2px solid #ddd;
}

.recaptcha-box{
margin-top:18px;
display:flex;
justify-content:center;
min-height:78px;
overflow:hidden;
}

.otp-section{
display:none;
margin-top:20px;
padding-top:18px;
border-top:1px solid #ddd;
}

.otp-section.show{
display:block;
}

.small{
font-size:13px;
color:#666;
line-height:1.5;
}

.login-link{
text-align:center;
margin-top:20px;
font-size:14px;
}

.login-link a{
color:#0a4ea3;
font-weight:bold;
text-decoration:none;
}

.hidden{
display:none !important;
}

</style></head><body><div class="container"><div class="card"><div class="logo">
🌍 Logical World
</div><div class="subtitle">
Create your mobile account
</div><!-- REGISTRATION --><div id="registrationSection"><label for="fullName">
Real Name
</label><input
type="text"
id="fullName"
placeholder="Enter your real name"
autocomplete="name"

«»

<label for="age">
Age
</label><input
type="number"
id="age"
placeholder="Enter your age"
min="13"
max="120"

«»

<label for="phoneNumber">
Phone Number
</label><input
type="tel"
id="phoneNumber"
placeholder="08012345678"
autocomplete="tel"

«»

<div class="small">
Use your Nigerian number. Example:
08012345678
</div><label for="profilePicture">
Profile Picture
</label><input
type="file"
id="profilePicture"
accept="image/*"

«»

<img
id="photoPreview"
class="photo-preview hidden"
alt="Profile preview"

«»

<!-- RECAPTCHA --><div
id="recaptchaStatus"
class="small"
style="text-align:center;margin-top:15px;"
>
Loading security verification...
</div><div
id="recaptcha-container"
class="recaptcha-box"
></div><button
id="sendOtpBtn"
class="primary"
disabled

«»

Send Verification Code
</button>

<div
id="statusMessage"
class="status"
></div></div><!-- OTP --><div
id="otpSection"
class="otp-section"
><label for="otpCode">
SMS Verification Code
</label><input
type="text"
id="otpCode"
placeholder="Enter the 6-digit code"
inputmode="numeric"
maxlength="6"
autocomplete="one-time-code"

«»

<div class="small">
Enter the verification code sent to your phone.
</div><button
id="verifyBtn"
class="primary"

«»

Verify & Create Account
</button>

<button
id="changeNumberBtn"
class="secondary"

«»

Change Phone Number
</button>

</div><div
id="finalStatus"
class="status"
></div><div class="login-link">Already have an account?

<a href="login.html">
Login
</a></div></div></div><script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
auth,
db
}
from "./firebase.js";


import {
RecaptchaVerifier,
signInWithPhoneNumber,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
doc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================
   CLOUDINARY
========================================= */

const CLOUDINARY_CLOUD_NAME =
"rkcnhhdb";

const CLOUDINARY_UPLOAD_PRESET =
"logicalworld_pages";


/* =========================================
   ELEMENTS
========================================= */

const fullName =
document.getElementById("fullName");

const age =
document.getElementById("age");

const phoneNumber =
document.getElementById("phoneNumber");

const profilePicture =
document.getElementById("profilePicture");

const photoPreview =
document.getElementById("photoPreview");

const sendOtpBtn =
document.getElementById("sendOtpBtn");

const verifyBtn =
document.getElementById("verifyBtn");

const changeNumberBtn =
document.getElementById("changeNumberBtn");

const otpCode =
document.getElementById("otpCode");

const otpSection =
document.getElementById("otpSection");

const registrationSection =
document.getElementById("registrationSection");

const statusMessage =
document.getElementById("statusMessage");

const finalStatus =
document.getElementById("finalStatus");

const recaptchaStatus =
document.getElementById("recaptchaStatus");

const recaptchaContainer =
document.getElementById("recaptcha-container");


/* =========================================
   VARIABLES
========================================= */

let recaptchaVerifier = null;

let confirmationResult = null;

let recaptchaReady = false;


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(
element,
message,
type
){

if(!message){

element.textContent = "";

element.className = "status";

return;

}

element.textContent =
message;

element.className =
"status " + type;

}


/* =========================================
   NORMALIZE NIGERIAN PHONE
========================================= */

function normalizeNigerianPhone(
value
){

let phone =
String(value || "").trim();

phone =
phone.replace(
/[\s()-]/g,
""
);

if(
phone.startsWith("+234")
){

return phone;

}

if(
phone.startsWith("234")
){

return "+" + phone;

}

if(
phone.startsWith("0")
){

return "+234" +
phone.substring(1);

}

return phone;

}


/* =========================================
   VALIDATE NIGERIAN PHONE
========================================= */

function isValidNigerianPhone(
phone
){

return /^\+234\d{10}$/.test(phone);

}


/* =========================================
   PROFILE PHOTO PREVIEW
========================================= */

profilePicture.addEventListener(
"change",
function(){

const file =
profilePicture.files[0];

if(!file){

photoPreview.src = "";

photoPreview.classList.add(
"hidden"
);

return;

}

if(
!file.type.startsWith("image/")
){

showStatus(
statusMessage,
"Please select an image file.",
"error"
);

profilePicture.value = "";

photoPreview.src = "";

photoPreview.classList.add(
"hidden"
);

return;

}

if(
file.size > 25 * 1024 * 1024
){

showStatus(
statusMessage,
"Profile picture must be 25 MB or smaller.",
"error"
);

profilePicture.value = "";

photoPreview.src = "";

photoPreview.classList.add(
"hidden"
);

return;

}

const reader =
new FileReader();

reader.onload =
function(){

photoPreview.src =
reader.result;

photoPreview.classList.remove(
"hidden"
);

};

reader.readAsDataURL(file);

});


/* =========================================
   CREATE RECAPTCHA
========================================= */

async function setupRecaptcha(){

try{

recaptchaReady = false;

sendOtpBtn.disabled = true;

recaptchaStatus.textContent =
"Loading security verification...";


/*
If an old verifier exists, remove it.
*/

if(
recaptchaVerifier
){

try{

recaptchaVerifier.clear();

}catch(error){

console.warn(
"Could not clear old reCAPTCHA:",
error
);

}

recaptchaVerifier = null;

}


/*
Clear the container.
*/

recaptchaContainer.innerHTML = "";


/*
Create Firebase reCAPTCHA.
*/

recaptchaVerifier =
new RecaptchaVerifier(
auth,
"recaptcha-container",
{

size:"normal",

callback:
function(){

recaptchaReady = true;

recaptchaStatus.textContent =
"✓ Security check completed.";

sendOtpBtn.disabled = false;

},

"expired-callback":
function(){

recaptchaReady = false;

sendOtpBtn.disabled = true;

recaptchaStatus.textContent =
"Security check expired. Please complete it again.";

},

"error-callback":
function(error){

console.error(
"reCAPTCHA error:",
error
);

recaptchaReady = false;

sendOtpBtn.disabled = true;

recaptchaStatus.textContent =
"Security check failed. Please reload the page.";

}

});


await recaptchaVerifier.render();

recaptchaStatus.textContent =
"Please complete the security check above.";

}catch(error){

console.error(
"reCAPTCHA setup error:",
error
);

recaptchaReady = false;

sendOtpBtn.disabled = true;

recaptchaStatus.textContent =
"Security verification could not load.";

showStatus(
statusMessage,
"Could not load the security verification. Please reload the page.",
"error"
);

}

}


/* =========================================
   SEND SMS
========================================= */

sendOtpBtn.addEventListener(
"click",
async function(){

if(!recaptchaReady){

showStatus(
statusMessage,
"Please complete the security check first.",
"error"
);

return;

}


const name =
fullName.value.trim();

const userAge =
Number(age.value);

const phone =
normalizeNigerianPhone(
phoneNumber.value.trim()
);


/* NAME */

if(
name.length < 2
){

showStatus(
statusMessage,
"Please enter your real name.",
"error"
);

return;

}


/* AGE */

if(
!Number.isInteger(userAge)
||
userAge < 13
||
userAge > 120
){

showStatus(
statusMessage,
"Please enter a valid age between 13 and 120.",
"error"
);

return;

}


/* PHONE */

if(
!isValidNigerianPhone(phone)
){

showStatus(
statusMessage,
"Please enter a valid Nigerian phone number, for example 08012345678.",
"error"
);

return;

}


/* PHOTO */

const photoFile =
profilePicture.files[0];

if(!photoFile){

showStatus(
statusMessage,
"Please select a profile picture.",
"error"
);

return;

}


try{

sendOtpBtn.disabled = true;

sendOtpBtn.textContent =
"Sending SMS...";

showStatus(
statusMessage,
"Sending your verification code...",
"info"
);


/*
IMPORTANT:

Do NOT automatically recreate
the reCAPTCHA here if Firebase
returns an error.
*/

confirmationResult =
await signInWithPhoneNumber(
auth,
phone,
recaptchaVerifier
);


/*
SMS SENT
*/

showStatus(
statusMessage,
"✓ Verification code sent to " +
phone +
". Check your SMS messages.",
"success"
);

otpSection.classList.add(
"show"
);

sendOtpBtn.textContent =
"SMS Code Sent";

otpCode.focus();


}catch(error){

console.error(
"Firebase SMS error:",
error
);

console.error(
"Firebase error code:",
error.code
);

console.error(
"Firebase error message:",
error.message
);


/*
DO NOT automatically rebuild
the reCAPTCHA here.

This prevents the endless
reCAPTCHA loop.
*/

sendOtpBtn.disabled = true;

sendOtpBtn.textContent =
"Send Verification Code";


let message =
"Could not send the verification code.";


if(
error.code ===
"auth/operation-not-allowed"
){

message =
"Firebase Phone Authentication is being rejected. Phone is enabled, so we need to check the Firebase web app/domain configuration.";

}

else if(
error.code ===
"auth/quota-exceeded"
){

message =
"Firebase SMS quota has been reached. Please try again later.";

}

else if(
error.code ===
"auth/too-many-requests"
){

message =
"Too many requests. Please wait and try again later.";

}

else if(
error.code ===
"auth/invalid-phone-number"
){

message =
"The phone number is invalid. Please enter a Nigerian number such as 08012345678.";

}

else if(
error.code ===
"auth/captcha-check-failed"
){

message =
"Firebase rejected the security check. Please reload the page and complete the security check again.";

}

else if(
error.code ===
"auth/network-request-failed"
){

message =
"Network connection failed. Please check your internet connection and try again.";

}

else if(
error.code
){

message +=
" Firebase: " +
error.code;

}


showStatus(
statusMessage,
message,
"error"
);

});


/* =========================================
   VERIFY SMS
========================================= */

verifyBtn.addEventListener(
"click",
async function(){

if(!confirmationResult){

showStatus(
finalStatus,
"Please request the SMS verification code first.",
"error"
);

return;

}


const code =
otpCode.value.trim();

if(
! /^\d{6}$/.test(code)
){

showStatus(
finalStatus,
"Please enter the 6-digit verification code.",
"error"
);

return;

}


const name =
fullName.value.trim();

const userAge =
Number(age.value);

const phone =
normalizeNigerianPhone(
phoneNumber.value.trim()
);

const photoFile =
profilePicture.files[0];


if(!photoFile){

showStatus(
finalStatus,
"Please select a profile picture.",
"error"
);

return;

}


try{

verifyBtn.disabled = true;

verifyBtn.textContent =
"Verifying...";

showStatus(
finalStatus,
"Verifying your phone number...",
"info"
);


/*
Confirm SMS.
*/

const result =
await confirmationResult.confirm(
code
);

const user =
result.user;


/*
Update Firebase profile.
*/

try{

await updateProfile(
user,
{
displayName:name
}
);

}catch(profileError){

console.warn(
"Profile update warning:",
profileError
);

}


/*
Upload profile picture.
*/

verifyBtn.textContent =
"Uploading picture...";

showStatus(
finalStatus,
"Phone verified. Uploading your profile picture...",
"info"
);


const formData =
new FormData();

formData.append(
"file",
photoFile
);

formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const cloudinaryResponse =
await fetch(
"https://api.cloudinary.com/v1_1/" +
CLOUDINARY_CLOUD_NAME +
"/image/upload",
{
method:"POST",
body:formData
}
);


if(
!cloudinaryResponse.ok
){

throw new Error(
"Profile picture upload failed."
);

}


const cloudinaryData =
await cloudinaryResponse.json();

const profilePhotoURL =
cloudinaryData.secure_url || "";


/*
Save account to Firestore.
*/

verifyBtn.textContent =
"Creating account...";

showStatus(
finalStatus,
"Saving your Logical World account...",
"info"
);


await setDoc(
doc(
db,
"users",
user.uid
),
{

uid:user.uid,

name:name,

displayName:name,

phoneNumber:phone,

age:userAge,

profilePhotoURL:
profilePhotoURL,

accountStatus:"active",

role:"user",

accountType:"mobile-user",

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp(),

walletBalance:0,

walletCurrency:"NGN",

walletStatus:"active",

walletAccountNumber:null,

walletAccountName:name,

walletCreatedAt:
serverTimestamp(),

walletUpdatedAt:
serverTimestamp()

},
{
merge:true
}
);


/*
ACCOUNT CREATED
*/

showStatus(
finalStatus,
"✓ Account created successfully. Opening Logical World...",
"success"
);

registrationSection.classList.add(
"hidden"
);

otpSection.classList.remove(
"show"
);

setTimeout(
function(){

window.location.href =
"mobile.html";

},
1200
);


}catch(error){

console.error(
"Account creation error:",
error
);

console.error(
"Firebase error code:",
error.code
);

verifyBtn.disabled = false;

verifyBtn.textContent =
"Verify & Create Account";


let message =
"Account creation failed.";


if(
error.code ===
"auth/invalid-verification-code"
){

message =
"The verification code is incorrect. Please check the SMS and try again.";

}

else if(
error.code ===
"auth/code-expired"
){

message =
"The verification code has expired. Please request a new code.";

}

else if(
error.code ===
"auth/too-many-requests"
){

message =
"Too many verification attempts. Please wait and try again.";

}

else if(
error.message
){

message =
error.message;

}


showStatus(
finalStatus,
message,
"error"
);

}

});


/* =========================================
   CHANGE PHONE NUMBER
========================================= */

changeNumberBtn.addEventListener(
"click",
async function(){

confirmationResult = null;

otpCode.value = "";

otpSection.classList.remove(
"show"
);

verifyBtn.disabled = false;

verifyBtn.textContent =
"Verify & Create Account";

showStatus(
finalStatus,
"",
""
);

showStatus(
statusMessage,
"",
""
);


/*
Only when the user deliberately
changes the number do we create
a fresh reCAPTCHA.
*/

await setupRecaptcha();

});


/* =========================================
   OTP INPUT
========================================= */

otpCode.addEventListener(
"input",
function(){

otpCode.value =
otpCode.value
.replace(/\D/g,"")
.slice(0,6);

});


/* =========================================
   PHONE INPUT
========================================= */

phoneNumber.addEventListener(
"input",
function(){

phoneNumber.value =
phoneNumber.value.replace(
/[^0-9+\s()-]/g,
""
);

});


/* =========================================
   START
========================================= */

setupRecaptcha();

</script></body></html>
