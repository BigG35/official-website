<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:100%;
max-width:450px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#0a4ea3;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#083d82;
}

</style>

</head>

<body>

<div class="container">

<h1>Login</h1>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button id="loginBtn">
Login
  </button>
  </div>

<script type="module">

import { auth } from "./firebase.js";

import {
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(email==="" || password===""){

alert("Please enter your email and password.");

return;

}

try{

await signInWithEmailAndPassword(auth,email,password);

alert("Login Successful!");

if(email==="alagoagodstime@gmail.com"){

location.href="admin.html";

}else{

location.href="index.html";

}

}catch(error){

alert(error.message);

}

});

  </script>
  </body>
  </html>
