<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:white;
padding:30px;
width:100%;
max-width:450px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#0a4ea3;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#0a4ea3;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#083d82;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.create-link{
text-align:center;
margin-top:20px;
}

.create-link a{
color:#0a4ea3;
font-weight:bold;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🔐 Login</h1>

<p class="subtitle">
Login to manage your Logical World page
</p>


<input
type="email"
id="email"
placeholder="Email Address"
autocomplete="email"
>


<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
>


<button id="loginBtn">
Login
</button>


<div class="create-link">

<p>
Don't have a page yet?
</p>

<a href="create-page.html">
➕ Create Your Page
</a>

</div>

</div>


<script type="module">

import {
auth,
db
}
from "./firebase.js";


import {
signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
query,
where,
getDocs,
doc,
setDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const loginBtn =
document.getElementById(
"loginBtn"
);


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
"click",
async()=>{

const email =
document.getElementById(
"email"
).value.trim()
.toLowerCase();

const password =
document.getElementById(
"password"
).value;


if(
email === "" ||
password === ""
){

alert(
"Please enter your email and password."
);

return;

}


try{

loginBtn.disabled =
true;

loginBtn.innerText =
"Logging in...";


/* =========================
   FIREBASE LOGIN
========================= */

const credential =
await signInWithEmailAndPassword(
auth,
email,
password
);


const user =
credential.user;


/* =====================================================
   SAVE / UPDATE USER FOR CHAT
===================================================== */

try{

const userName =

user.displayName ||
email.split("@")[0] ||
"User";


await setDoc(

doc(
db,
"users",
user.uid
),

{

uid:
user.uid,

name:
userName,

displayName:
userName,

email:
user.email ||
email,

role:
"user",

accountStatus:
"active",

updatedAt:
serverTimestamp()

},

{
merge:true
}

);


console.log(
"User saved to users collection:",
user.uid
);


}catch(
userSaveError
){

/*
Do not stop the login if the user
document cannot be saved.

The login and page management
can still continue.
*/

console.warn(
"Could not save user to users collection:",
userSaveError
);

}


/* =========================
   CHECK ADMIN
========================= */

if(
user.email ===
"alagoagodstime@gmail.com"
){

alert(
"Admin login successful!"
);

location.href =
"admin.html";

return;

}


/* =========================
   CHECK OWNER PAGE
========================= */

const pagesRef =
collection(
db,
"approvedPages"
);


const q =
query(

pagesRef,

where(
"ownerId",
"==",
user.uid
)

);


const snapshot =
await getDocs(q);


/* =========================
   OWNER HAS APPROVED PAGE
========================= */

if(
!snapshot.empty
){

alert(
"Login successful!"
);

location.href =
"manage-page.html";

return;

}


/* =========================
   PAGE STILL PENDING
========================= */

const pendingRef =
collection(
db,
"pendingPages"
);


const pendingQuery =
query(

pendingRef,

where(
"ownerId",
"==",
user.uid
)

);


const pendingSnapshot =
await getDocs(
pendingQuery
);


if(
!pendingSnapshot.empty
){

alert(
"Your page is still waiting for admin approval."
);

location.href =
"index.html";

return;

}


/* =========================
   NO PAGE
========================= */

alert(
"Your account does not have a page yet."
);

location.href =
"create-page.html";


}catch(error){

console.error(
"Login error:",
error
);


alert(
"Login failed: " +
error.message
);


loginBtn.disabled =
false;

loginBtn.innerText =
"Login";

}

});

</script>

</body>

   </html>
