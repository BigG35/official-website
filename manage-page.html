<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage My Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f2f5;
color:#222;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
margin:20px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h2{
color:#0a4ea3;
margin-bottom:15px;
text-align:center;
}

h3{
color:#0a4ea3;
margin-bottom:10px;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

textarea{
height:110px;
resize:vertical;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:7px;
background:#0a4ea3;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#083d82;
}

.logout{
background:#555;
}

.change-logo{
background:#1976d2;
}

.post{
border-top:1px solid #ddd;
padding-top:20px;
margin-top:20px;
}

.post img,
.post video{
width:100%;
max-height:500px;
object-fit:contain;
border-radius:10px;
margin-top:12px;
background:#000;
}

.post-text{
font-size:17px;
margin-top:12px;
line-height:1.5;
}

.post-date{
font-size:13px;
color:#777;
margin-top:8px;
}

.delete-post{
background:#d32f2f;
}

.page-logo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:4px solid #eee;
}

.hidden{
display:none;
}

.message{
text-align:center;
padding:20px;
}

.password-info{
background:#eef5ff;
border-left:4px solid #0a4ea3;
padding:12px;
margin-top:12px;
font-size:14px;
}

</style>

</head>


<body>


<header>

<h1>🌍 Logical World</h1>

<p>Manage Your Page</p>

</header>


<div class="container">


<!-- =========================
     PAGE OWNER LOGIN
========================= -->

<div
id="pageLogin"
class="card"
>

<h2>
🔐 Page Owner Login
</h2>

<p
style="
text-align:center;
margin-bottom:15px;
"
>

Enter the page name and the private
password you created when creating the page.

</p>


<label>
Page Name
</label>

<input
type="text"
id="loginPageName"
placeholder="Enter your page name"
>


<label>
Private Page Password
</label>

<input
type="password"
id="loginPagePassword"
placeholder="Enter your page password"
>


<div class="password-info">

Your page password is different from the
Logical World Admin password.

</div>


<button id="pageLoginBtn">

🔓 Manage My Page

</button>


<p
id="loginError"
style="
color:red;
text-align:center;
margin-top:12px;
"
></p>

</div>


<!-- =========================
     MANAGEMENT AREA
========================= -->

<div
id="manageArea"
class="hidden"
>


<!-- PAGE PROFILE -->

<div class="card">

<img
id="pageLogo"
class="page-logo"
src="images/default-logo.png"
alt="Page Logo"
>


<h2 id="pageName">
My Page
</h2>


<label>
Change Logo
</label>

<input
type="file"
id="logoFile"
accept="image/*"
>


<button
class="change-logo"
id="changeLogoBtn"
>

🖼️ Change Logo

</button>

</div>


<!-- =========================
     NEW POST
========================= -->

<div class="card">

<h2>
📝 New Post
</h2>


<label>
Write about your post
</label>

<textarea
id="postText"
placeholder="Write something about your photo or video..."
></textarea>


<label>
Choose Photo or Video
</label>

<input
type="file"
id="postFile"
accept="image/*,video/*"
>


<button
id="publishBtn"
>

📤 Publish Post

</button>

</div>


<!-- =========================
     OLD POSTS
========================= -->

<div class="card">

<h2>
📱 My Posts
</h2>


<div id="postsList">

<p
style="
text-align:center;
color:#777;
"
>

No posts yet.

</p>

</div>

</div>


<button
class="logout"
id="logoutBtn"
>

🚪 Exit Page Management

</button>


</div>

</div>


<script type="module">


import { db }
from "./firebase.js";


import {
collection,
query,
where,
getDocs,
doc,
updateDoc,
addDoc,
serverTimestamp,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
"rkcnhhdb";

const CLOUDINARY_UPLOAD_PRESET =
"logicalworld_pages";


/* =========================
   ELEMENTS
========================= */

const pageLogin =
document.getElementById(
"pageLogin"
);

const manageArea =
document.getElementById(
"manageArea"
);

const loginPageName =
document.getElementById(
"loginPageName"
);

const loginPagePassword =
document.getElementById(
"loginPagePassword"
);

const pageLoginBtn =
document.getElementById(
"pageLoginBtn"
);

const loginError =
document.getElementById(
"loginError"
);

const pageName =
document.getElementById(
"pageName"
);

const pageLogo =
document.getElementById(
"pageLogo"
);

const logoFile =
document.getElementById(
"logoFile"
);

const changeLogoBtn =
document.getElementById(
"changeLogoBtn"
);

const postText =
document.getElementById(
"postText"
);

const postFile =
document.getElementById(
"postFile"
);

const publishBtn =
document.getElementById(
"publishBtn"
);

const postsList =
document.getElementById(
"postsList"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);


let currentPage = null;


/* =========================
   PAGE OWNER LOGIN
========================= */

pageLoginBtn.addEventListener(
"click",
async()=>{

const name =
loginPageName.value.trim();

const password =
loginPagePassword.value;


loginError.innerText = "";


if(!name || !password){

loginError.innerText =
"Please enter your page name and password.";

return;

}


try{

pageLoginBtn.disabled =
true;

pageLoginBtn.innerText =
"Checking...";


/* FIND APPROVED PAGE */

const pagesRef =
collection(
db,
"approvedPages"
);


const q =
query(

pagesRef,

where(
"pageName",
"==",
name
)

);


const snapshot =
await getDocs(q);


if(snapshot.empty){

loginError.innerText =
"Page not found or not approved.";

pageLoginBtn.disabled =
false;

pageLoginBtn.innerText =
"🔓 Manage My Page";

return;

}


let foundPage = null;


snapshot.forEach(
(pageDoc)=>{

const data =
pageDoc.data();


if(
data.pagePassword ===
password
){

foundPage = {

id:pageDoc.id,

data:data

};

}

});


if(!foundPage){

loginError.innerText =
"Incorrect page password.";

pageLoginBtn.disabled =
false;

pageLoginBtn.innerText =
"🔓 Manage My Page";

return;

}


currentPage =
foundPage;


/* SHOW PAGE */

pageLogin.classList.add(
"hidden"
);

manageArea.classList.remove(
"hidden"
);


/* PAGE NAME */

pageName.innerText =
currentPage.data.pageName ||
"My Page";


/* PAGE LOGO */

if(
currentPage.data.logoURL
){

pageLogo.src =
currentPage.data.logoURL;

}


/* LOAD POSTS */

await loadPosts();


}catch(error){

console.error(error);

loginError.innerText =
"Login error: " +
error.message;

}


pageLoginBtn.disabled =
false;

pageLoginBtn.innerText =
"🔓 Manage My Page";

});


/* =========================
   CHANGE LOGO
========================= */

changeLogoBtn.addEventListener(
"click",
async()=>{

if(!currentPage){

return;

}


if(!logoFile.files.length){

alert(
"Please select a new logo first."
);

return;

}


try{

changeLogoBtn.disabled =
true;

changeLogoBtn.innerText =
"Uploading...";


const file =
logoFile.files[0];


const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

{
method:"POST",
body:formData
}

);


if(!response.ok){

throw new Error(
"Logo upload failed."
);

}


const result =
await response.json();


await updateDoc(

doc(
db,
"approvedPages",
currentPage.id
),

{

logoURL:
result.secure_url

}

);


/* UPDATE LOCAL DATA */

currentPage.data.logoURL =
result.secure_url;


pageLogo.src =
result.secure_url;


alert(
"Logo changed successfully!"
);


}catch(error){

console.error(error);

alert(
"Logo change failed: " +
error.message
);

}


changeLogoBtn.disabled =
false;

changeLogoBtn.innerText =
"🖼️ Change Logo";

});


/* =========================
   PUBLISH NEW POST
========================= */

publishBtn.addEventListener(
"click",
async()=>{

if(!currentPage){

return;

}


const text =
postText.value.trim();

const file =
postFile.files[0];


if(!text && !file){

alert(
"Write something or select a photo/video."
);

return;

}


try{

publishBtn.disabled =
true;

publishBtn.innerText =
"Publishing...";


let mediaURL = "";

let mediaType = "";


/* =========================
   UPLOAD MEDIA
========================= */

if(file){

const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const resourceType =
file.type.startsWith("video/")
?
"video"
:
"image";


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`,

{
method:"POST",
body:formData
}

);


if(!response.ok){

throw new Error(
"Media upload failed."
);

}


const result =
await response.json();


mediaURL =
result.secure_url;

mediaType =
resourceType;

}


/* =========================
   SAVE POST
========================= */

await addDoc(

collection(
db,
"posts"
),

{

pageId:
currentPage.id,

pageName:
currentPage.data.pageName ||
"",

logoURL:
currentPage.data.logoURL ||
"",

text:
text,

mediaURL:
mediaURL,

mediaType:
mediaType,

createdAt:
serverTimestamp()

}

);


/* CLEAR */

postText.value = "";

postFile.value = "";


alert(
"Post published successfully!"
);


await loadPosts();


}catch(error){

console.error(error);

alert(
"Post failed: " +
error.message
);

}


publishBtn.disabled =
false;

publishBtn.innerText =
"📤 Publish Post";

});


/* =========================
   LOAD OLD POSTS
========================= */

async function loadPosts(){

postsList.innerHTML =
"Loading posts...";


try{

const postsRef =
collection(
db,
"posts"
);


const q =
query(

postsRef,

where(
"pageId",
"==",
currentPage.id
)

);


const snapshot =
await getDocs(q);


postsList.innerHTML = "";


if(snapshot.empty){

postsList.innerHTML = `

<p
style="
text-align:center;
color:#777;
"
>

No posts yet.

</p>

`;

return;

}


const posts =
snapshot.docs.map(
post=>({

id:post.id,

data:post.data()

})
);


/* NEWEST FIRST */

posts.sort(
(a,b)=>
getTime(
b.data.createdAt
)
-
getTime(
a.data.createdAt
)
);


posts.forEach(
(post)=>{

const data =
post.data;


const postDiv =
document.createElement(
"div"
);

postDiv.className =
"post";


let mediaHTML = "";


if(
data.mediaURL &&
data.mediaType ===
"image"
){

mediaHTML = `

<img
src="${data.mediaURL}"
alt="Post Image"
>

`;

}


if(
data.mediaURL &&
data.mediaType ===
"video"
){

mediaHTML = `

<video
src="${data.mediaURL}"
controls
></video>

`;

}


postDiv.innerHTML = `

<h3>
${escapeHTML(
data.pageName ||
currentPage.data.pageName ||
"My Page"
)}
</h3>

${
data.text
?
`
<p class="post-text">
${escapeHTML(data.text)}
</p>
`
:
""
}

${mediaHTML}

<p class="post-date">
${formatDate(data.createdAt)}
</p>

<button
class="delete-post"
data-id="${post.id}"
>

🗑️ Delete Post

</button>

`;


postsList.appendChild(
postDiv
);

});


}catch(error){

console.error(error);

postsList.innerHTML =
"Could not load posts.";

}

}


/* =========================
   DELETE POST
========================= */

document.addEventListener(
"click",
async(e)=>{

if(
!e.target.classList.contains(
"delete-post"
)
){

return;

}


const postId =
e.target.dataset.id;


if(
!confirm(
"Delete this post?"
)
){

return;

}


try{

await deleteDoc(

doc(
db,
"posts",
postId
)

);


alert(
"Post deleted."
);


await loadPosts();


}catch(error){

alert(
"Delete failed: " +
error.message
);

}

});


/* =========================
   EXIT MANAGEMENT
========================= */

logoutBtn.addEventListener(
"click",
()=>{

currentPage = null;

manageArea.classList.add(
"hidden"
);

pageLogin.classList.remove(
"hidden"
);

loginPageName.value = "";

loginPagePassword.value = "";

loginError.innerText = "";

});


/* =========================
   HELPERS
========================= */

function getTime(timestamp){

if(
timestamp &&
typeof timestamp.toMillis ===
"function"
){

return timestamp.toMillis();

}

return 0;

}


function formatDate(timestamp){

if(
!timestamp ||
typeof timestamp.toDate !==
"function"
){

return "";

}

return timestamp
.toDate()
.toLocaleString();

}


function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>

</body>

</html>
