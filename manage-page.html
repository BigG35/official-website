<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage My Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f2f5;
color:#222;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:24px;
}

header p{
margin-top:5px;
}

.container{
max-width:800px;
margin:20px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h2{
color:#0a4ea3;
margin-bottom:15px;
text-align:center;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:7px;
background:#0a4ea3;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#083d82;
}

.profile-logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:4px solid #eee;
}

.profile-actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:18px;
}

.profile-actions button{
flex:1;
min-width:150px;
margin-top:0;
}

.upload-pictures{
background:#1976d2;
}

.upload-pictures:hover{
background:#125ca8;
}

.chat-button{
background:#198754;
}

.chat-button:hover{
background:#146c43;
}

.post-button{
background:#0a4ea3;
}

.logout{
background:#555;
}

.logout:hover{
background:#333;
}

.hidden{
display:none !important;
}

.message{
text-align:center;
padding:30px;
}

.status{
text-align:center;
padding:12px;
background:#eef5ff;
border-radius:8px;
margin-bottom:20px;
color:#0a4ea3;
}

.progress-container{
display:none;
margin-top:15px;
}

.progress-text{
text-align:center;
font-size:14px;
color:#555;
margin-bottom:7px;
}

.progress-bar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0%;
background:#1976d2;
transition:width .2s ease;
}

.success-message{
display:none;
background:#e8f7ee;
color:#146c43;
padding:12px;
border-radius:7px;
margin-top:12px;
text-align:center;
}

.error-message{
display:none;
background:#fdeaea;
color:#b02a37;
padding:12px;
border-radius:7px;
margin-top:12px;
text-align:center;
}

.file-name{
text-align:center;
color:#666;
font-size:14px;
margin-top:8px;
}

/* =========================
   POST MODAL
========================= */

.post-modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:99999;
align-items:center;
justify-content:center;
padding:20px;
}

.post-modal.show{
display:flex;
}

.post-modal-content{
background:white;
width:100%;
max-width:550px;
max-height:90vh;
overflow-y:auto;
border-radius:14px;
padding:22px;
position:relative;
box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.post-modal-content textarea{
width:100%;
height:110px;
resize:vertical;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.post-modal-content input[type="file"]{
width:100%;
padding:10px 0;
margin-top:8px;
}

.close-post{
position:absolute;
right:12px;
top:8px;
width:auto;
margin:0;
padding:0 8px;
background:transparent;
color:#555;
font-size:32px;
}

.close-post:hover{
background:transparent;
color:#000;
}

.cancel-button{
background:#777;
}

.publish-button{
background:#0a4ea3;
}

@media(max-width:600px){

.container{
padding:10px;
}

.card{
padding:16px;
}

.profile-actions{
flex-direction:column;
}

.profile-actions button{
width:100%;
}

.post-modal{
padding:10px;
}

.post-modal-content{
padding:18px;
}

}

</style>

</head>

<body>


<header>

<h1>🌍 Logical World</h1>

<p>Manage Your Page</p>

</header>


<div class="container">


<!-- =========================
     LOADING
========================= -->

<div
id="loading"
class="card message"
>

Checking your account...

</div>


<!-- =========================
     LOGIN REQUIRED
========================= -->

<div
id="loginRequired"
class="card message hidden"
>

<h2>
🔐 Login Required
</h2>

<p>
Please login to manage your page.
</p>

<button
onclick="location.href='login.html'"
>
Login
</button>

</div>


<!-- =========================
     NO APPROVED PAGE
========================= -->

<div
id="noPage"
class="card message hidden"
>

<h2>
📄 No Approved Page
</h2>

<p>
Your page has not been approved yet,
or you do not have an approved page.
</p>

<button
onclick="location.href='index.html'"
>
Go To Logical World
</button>

</div>


<!-- =========================
     MANAGEMENT AREA
========================= -->

<div
id="manageArea"
class="hidden"
>


<!-- =========================
     PAGE PROFILE
========================= -->

<div class="card">

<div class="status">

You are logged in as the page owner.

</div>


<img
id="pageLogo"
class="profile-logo"
src="images/default-logo.png"
alt="Page Logo"
>


<h2 id="pageName">
My Page
</h2>


<!-- =========================
     PICTURE UPLOAD
========================= -->

<input
type="file"
id="pictureFiles"
accept="image/*"
multiple
style="display:none;"
>


<div class="profile-actions">


<button
class="upload-pictures"
id="uploadPicturesBtn"
>
📸 Upload Pictures
</button>


<button
class="chat-button"
id="chatBtn"
>
💬 Chat
</button>


<button
class="post-button"
id="postBtn"
>
📤 Post
</button>


</div>


<!-- =========================
     PICTURE PROGRESS
========================= -->

<div
id="pictureProgress"
class="progress-container"
>

<div
id="pictureProgressText"
class="progress-text"
>
Preparing upload...
</div>


<div class="progress-bar">

<div
id="pictureProgressFill"
class="progress-fill"
>
</div>

</div>

</div>


<div
id="pictureSuccess"
class="success-message"
>
</div>


<div
id="pictureError"
class="error-message"
>
</div>


</div>


<!-- =========================
     LOGOUT
========================= -->

<button
class="logout"
id="logoutBtn"
>
🚪 Logout
</button>


</div>

</div>


<!-- =========================
     POST MODAL
========================= -->

<div
id="postModal"
class="post-modal"
>


<div
class="post-modal-content"
>


<button
id="closePostBtn"
class="close-post"
>
&times;
</button>


<h2>
📝 Create New Post
</h2>


<label>
Write about your post
</label>


<textarea
id="postText"
placeholder="Write something about your photo or video..."
></textarea>


<label>
Choose Photo or Video
</label>


<input
type="file"
id="postFile"
accept="image/*,video/*"
>


<p
id="postFileName"
class="file-name"
>
</p>


<button
id="publishBtn"
class="publish-button"
>
📤 Publish Post
</button>


<button
id="cancelPostBtn"
class="cancel-button"
>
Cancel
</button>


<div
id="postSuccess"
class="success-message"
>
</div>


<div
id="postError"
class="error-message"
>
</div>


</div>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
query,
where,
getDocs,
doc,
updateDoc,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
"rkcnhhdb";

const CLOUDINARY_UPLOAD_PRESET =
"logicalworld_pages";


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById(
"loading"
);

const loginRequired =
document.getElementById(
"loginRequired"
);

const noPage =
document.getElementById(
"noPage"
);

const manageArea =
document.getElementById(
"manageArea"
);

const pageName =
document.getElementById(
"pageName"
);

const pageLogo =
document.getElementById(
"pageLogo"
);

const pictureFiles =
document.getElementById(
"pictureFiles"
);

const uploadPicturesBtn =
document.getElementById(
"uploadPicturesBtn"
);

const chatBtn =
document.getElementById(
"chatBtn"
);

const postBtn =
document.getElementById(
"postBtn"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);


/* PICTURE PROGRESS */

const pictureProgress =
document.getElementById(
"pictureProgress"
);

const pictureProgressText =
document.getElementById(
"pictureProgressText"
);

const pictureProgressFill =
document.getElementById(
"pictureProgressFill"
);

const pictureSuccess =
document.getElementById(
"pictureSuccess"
);

const pictureError =
document.getElementById(
"pictureError"
);


/* POST */

const postModal =
document.getElementById(
"postModal"
);

const closePostBtn =
document.getElementById(
"closePostBtn"
);

const cancelPostBtn =
document.getElementById(
"cancelPostBtn"
);

const postText =
document.getElementById(
"postText"
);

const postFile =
document.getElementById(
"postFile"
);

const postFileName =
document.getElementById(
"postFileName"
);

const publishBtn =
document.getElementById(
"publishBtn"
);

const postSuccess =
document.getElementById(
"postSuccess"
);

const postError =
document.getElementById(
"postError"
);


let currentUser =
null;

let currentPage =
null;


/* =========================
   CHECK LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{

loading.classList.add(
"hidden"
);


if(!user){

loginRequired.classList.remove(
"hidden"
);

return;

}


currentUser =
user;


await findMyPage();

});


/* =========================
   FIND APPROVED PAGE
========================= */

async function findMyPage(){

try{

const pagesRef =
collection(
db,
"approvedPages"
);


const q =
query(

pagesRef,

where(
"ownerId",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);


if(snapshot.empty){

noPage.classList.remove(
"hidden"
);

return;

}


const pageDoc =
snapshot.docs[0];


currentPage = {

id:
pageDoc.id,

data:
pageDoc.data()

};


/* PAGE NAME */

pageName.innerText =
currentPage.data.pageName ||
"My Page";


/* PROFILE PICTURE */

if(
currentPage.data.logoURL
){

pageLogo.src =
currentPage.data.logoURL;

}


/* SHOW MANAGEMENT */

manageArea.classList.remove(
"hidden"
);


}catch(error){

console.error(
"Page loading error:",
error
);


alert(
"Could not load your page: " +
error.message
);

}

}


/* =========================
   UPLOAD PICTURES BUTTON
========================= */

uploadPicturesBtn.addEventListener(
"click",
()=>{

pictureFiles.click();

});


/* =========================
   SELECT PICTURES
========================= */

pictureFiles.addEventListener(
"change",
async()=>{

const files =
Array.from(
pictureFiles.files
);


if(!files.length){

return;

}


/* =========================
   MAX 200
========================= */

if(
files.length > 200
){

alert(
"You can upload a maximum of 200 pictures at a time."
);

pictureFiles.value =
"";

return;

}


/* =========================
   UPLOAD
========================= */

await uploadPictures(
files
);

});


/* =========================
   UPLOAD PICTURES
========================= */

async function uploadPictures(
files
){

if(!currentPage){

return;

}


try{

uploadPicturesBtn.disabled =
true;

uploadPicturesBtn.innerText =
"Uploading...";


pictureSuccess.style.display =
"none";

pictureError.style.display =
"none";


pictureProgress.style.display =
"block";


pictureProgressFill.style.width =
"0%";


const uploadedURLs =
[];


for(
let i = 0;
i < files.length;
i++
){

const file =
files[i];


/* =========================
   CHECK IMAGE
========================= */

if(
!file.type.startsWith(
"image/"
)
){

throw new Error(
file.name +
" is not an image."
);

}


/* =========================
   UPDATE PROGRESS
========================= */

pictureProgressText.innerText =
"Uploading picture " +
(i + 1) +
" of " +
files.length +
"...";


/* =========================
   CLOUDINARY FORM
========================= */

const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


/* =========================
   CLOUDINARY UPLOAD
========================= */

const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

{

method:
"POST",

body:
formData

}

);


if(!response.ok){

throw new Error(
"Upload failed for " +
file.name
);

}


const result =
await response.json();


uploadedURLs.push(
result.secure_url
);


/* =========================
   PROGRESS BAR
========================= */

const percent =
Math.round(
((i + 1) / files.length) * 100
);


pictureProgressFill.style.width =
percent + "%";

}


/* =========================
   GET EXISTING PHOTOS
========================= */

const existingPhotos =
Array.isArray(
currentPage.data.photos
)
?
currentPage.data.photos
:
[];


/* =========================
   ADD NEW PHOTOS
========================= */

const allPhotos =
[

...existingPhotos,

...uploadedURLs

];


/* =========================
   UPDATE FIRESTORE
========================= */

await updateDoc(

doc(
db,
"approvedPages",
currentPage.id
),

{

photos:
allPhotos

}

);


/* =========================
   UPDATE LOCAL DATA
========================= */

currentPage.data.photos =
allPhotos;


/* =========================
   SUCCESS
========================= */

pictureProgressText.innerText =
"Upload complete! " +
uploadedURLs.length +
" picture(s) added.";


pictureProgressFill.style.width =
"100%";


pictureSuccess.innerText =
uploadedURLs.length +
" picture(s) uploaded successfully.";

pictureSuccess.style.display =
"block";


pictureFiles.value =
"";


}catch(error){

console.error(
"Picture upload error:",
error
);


pictureError.innerText =
"Picture upload failed: " +
error.message;

pictureError.style.display =
"block";


pictureProgressText.innerText =
"Upload stopped.";

}finally{

uploadPicturesBtn.disabled =
false;

uploadPicturesBtn.innerText =
"📸 Upload Pictures";

}

}


/* =========================
   CHAT
========================= */

chatBtn.addEventListener(
"click",
()=>{

if(!currentPage){

return;

}


const chatURL =
"chat.html?pageId=" +
encodeURIComponent(
currentPage.id
);


window.location.href =
chatURL;

});


/* =========================
   OPEN POST
========================= */

postBtn.addEventListener(
"click",
()=>{

postModal.classList.add(
"show"
);


hidePostMessages();


setTimeout(
()=>{

postText.focus();

},
100
);

});


/* =========================
   CLOSE POST
========================= */

function closePost(){

postModal.classList.remove(
"show"
);

}


closePostBtn.addEventListener(
"click",
closePost
);


cancelPostBtn.addEventListener(
"click",
closePost
);


/* =========================
   CLICK OUTSIDE
========================= */

postModal.addEventListener(
"click",
(e)=>{

if(
e.target === postModal
){

closePost();

}

});


/* =========================
   ESCAPE
========================= */

document.addEventListener(
"keydown",
(e)=>{

if(
e.key === "Escape"
){

closePost();

}

});


/* =========================
   POST FILE
========================= */

postFile.addEventListener(
"change",
()=>{

if(
!postFile.files.length
){

postFileName.innerText =
"";

return;

}


postFileName.innerText =
"Selected: " +
postFile.files[0].name;

});


/* =========================
   PUBLISH POST
========================= */

publishBtn.addEventListener(
"click",
async()=>{

if(!currentPage){

return;

}


const text =
postText.value.trim();

const file =
postFile.files[0];


if(!text && !file){

showPostError(
"Write something or select a photo/video."
);

return;

}


try{

publishBtn.disabled =
true;

publishBtn.innerText =
"Publishing...";


hidePostMessages();


let mediaURL =
"";

let mediaType =
"";


/* =========================
   UPLOAD POST MEDIA
========================= */

if(file){

const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const resourceType =
file.type.startsWith(
"video/"
)
?
"video"
:
"image";


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`,

{

method:
"POST",

body:
formData

}

);


if(!response.ok){

throw new Error(
"Media upload failed."
);

}


const result =
await response.json();


mediaURL =
result.secure_url;


mediaType =
resourceType;

}


/* =========================
   SAVE POST
========================= */

await addDoc(

collection(
db,
"posts"
),

{

pageId:
currentPage.id,

ownerId:
currentUser.uid,

pageName:
currentPage.data.pageName ||
"",

logoURL:
currentPage.data.logoURL ||
"",

text:
text,

mediaURL:
mediaURL,

mediaType:
mediaType,

createdAt:
serverTimestamp()

}

);


/* =========================
   CLEAR
========================= */

postText.value =
"";

postFile.value =
"";

postFileName.innerText =
"";


showPostSuccess(
"Post published successfully!"
);


/* CLOSE */

setTimeout(
()=>{

closePost();

hidePostMessages();

},
1200
);


}catch(error){

console.error(
"Post error:",
error
);


showPostError(
"Post failed: " +
error.message
);

}


publishBtn.disabled =
false;

publishBtn.innerText =
"📤 Publish Post";

});


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
"click",
async()=>{

try{

await signOut(
auth
);


location.href =
"login.html";


}catch(error){

alert(
"Logout failed: " +
error.message
);

}

});


/* =========================
   POST MESSAGES
========================= */

function hidePostMessages(){

postSuccess.style.display =
"none";

postError.style.display =
"none";

}


function showPostSuccess(
message
){

postSuccess.innerText =
message;

postSuccess.style.display =
"block";

postError.style.display =
"none";

}


function showPostError(
message
){

postError.innerText =
message;

postError.style.display =
"block";

postSuccess.style.display =
"none";

}

</script>

</body>

   </html>
