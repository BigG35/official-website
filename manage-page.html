<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage My Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f2f5;
color:#222;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:24px;
}

header p{
margin-top:5px;
}

.container{
max-width:800px;
margin:20px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h2{
color:#0a4ea3;
margin-bottom:15px;
text-align:center;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

textarea{
height:110px;
resize:vertical;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:7px;
background:#0a4ea3;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#083d82;
}

.profile-logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:4px solid #eee;
cursor:pointer;
}

.profile-actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:18px;
}

.profile-actions button{
flex:1;
min-width:150px;
margin-top:0;
}

.upload-profile{
background:#1976d2;
}

.upload-profile:hover{
background:#125ca8;
}

.chat-button{
background:#198754;
}

.chat-button:hover{
background:#146c43;
}

.post-button{
background:#0a4ea3;
}

.logout{
background:#555;
}

.logout:hover{
background:#333;
}

.hidden{
display:none !important;
}

.message{
text-align:center;
padding:30px;
}

.status{
text-align:center;
padding:12px;
background:#eef5ff;
border-radius:8px;
margin-bottom:20px;
color:#0a4ea3;
}

.file-name{
text-align:center;
color:#666;
font-size:14px;
margin-top:8px;
}

/* =========================
   POST MODAL
========================= */

.post-modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:99999;
align-items:center;
justify-content:center;
padding:20px;
}

.post-modal.show{
display:flex;
}

.post-modal-content{
background:white;
width:100%;
max-width:550px;
max-height:90vh;
overflow-y:auto;
border-radius:14px;
padding:22px;
position:relative;
box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.close-post{
position:absolute;
right:15px;
top:10px;
width:auto;
margin:0;
background:transparent;
color:#555;
font-size:30px;
padding:0 8px;
}

.close-post:hover{
background:transparent;
color:#000;
}

.publish-button{
background:#0a4ea3;
}

.cancel-button{
background:#777;
}

.success-message{
display:none;
background:#e8f7ee;
color:#146c43;
padding:12px;
border-radius:7px;
margin-top:12px;
text-align:center;
}

.error-message{
display:none;
background:#fdeaea;
color:#b02a37;
padding:12px;
border-radius:7px;
margin-top:12px;
text-align:center;
}

@media(max-width:600px){

.container{
padding:10px;
}

.card{
padding:16px;
}

.profile-actions{
flex-direction:column;
}

.profile-actions button{
width:100%;
}

.post-modal{
padding:10px;
}

.post-modal-content{
padding:18px;
}

}

</style>

</head>

<body>


<header>

<h1>🌍 Logical World</h1>

<p>Manage Your Page</p>

</header>


<div class="container">


<!-- =========================
     LOADING
========================= -->

<div
id="loading"
class="card message"
>

Checking your account...

</div>


<!-- =========================
     LOGIN REQUIRED
========================= -->

<div
id="loginRequired"
class="card message hidden"
>

<h2>
🔐 Login Required
</h2>

<p>
Please login to manage your page.
</p>

<button
onclick="location.href='login.html'"
>
Login
</button>

</div>


<!-- =========================
     NO APPROVED PAGE
========================= -->

<div
id="noPage"
class="card message hidden"
>

<h2>
📄 No Approved Page
</h2>

<p>
Your page has not been approved yet,
or you do not have an approved page.
</p>

<button
onclick="location.href='index.html'"
>
Go To Logical World
</button>

</div>


<!-- =========================
     MANAGEMENT AREA
========================= -->

<div
id="manageArea"
class="hidden"
>


<!-- =========================
     PAGE PROFILE
========================= -->

<div class="card">

<div class="status">

You are logged in as the page owner.

</div>


<img
id="pageLogo"
class="profile-logo"
src="images/default-logo.png"
alt="Page Logo"
title="Tap to upload profile picture"
>


<h2 id="pageName">
My Page
</h2>


<!-- Hidden profile image input -->

<input
type="file"
id="logoFile"
accept="image/*"
style="display:none;"
>


<!-- =========================
     ACTION BUTTONS
========================= -->

<div class="profile-actions">


<button
class="upload-profile"
id="uploadProfileBtn"
>
🖼️ Upload Profile Pic
</button>


<button
class="chat-button"
id="chatBtn"
>
💬 Chat
</button>


<button
class="post-button"
id="postBtn"
>
📤 Post
</button>


</div>


<div
id="profileSuccess"
class="success-message"
>
</div>


<div
id="profileError"
class="error-message"
>
</div>

</div>


<!-- =========================
     LOGOUT
========================= -->

<button
class="logout"
id="logoutBtn"
>
🚪 Logout
</button>


</div>

</div>


<!-- =========================
     POST MODAL
========================= -->

<div
id="postModal"
class="post-modal"
>


<div
class="post-modal-content"
>


<button
id="closePostBtn"
class="close-post"
title="Close"
>
&times;
</button>


<h2>
📝 Create New Post
</h2>


<label>
Write about your post
</label>


<textarea
id="postText"
placeholder="Write something about your photo or video..."
></textarea>


<label>
Choose Photo or Video
</label>


<input
type="file"
id="postFile"
accept="image/*,video/*"
>


<p
id="postFileName"
class="file-name"
>
</p>


<button
id="publishBtn"
class="publish-button"
>
📤 Publish Post
</button>


<button
id="cancelPostBtn"
class="cancel-button"
>
Cancel
</button>


<div
id="postSuccess"
class="success-message"
>
</div>


<div
id="postError"
class="error-message"
>
</div>


</div>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
query,
where,
getDocs,
doc,
updateDoc,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
"rkcnhhdb";

const CLOUDINARY_UPLOAD_PRESET =
"logicalworld_pages";


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById(
"loading"
);

const loginRequired =
document.getElementById(
"loginRequired"
);

const noPage =
document.getElementById(
"noPage"
);

const manageArea =
document.getElementById(
"manageArea"
);

const pageName =
document.getElementById(
"pageName"
);

const pageLogo =
document.getElementById(
"pageLogo"
);

const logoFile =
document.getElementById(
"logoFile"
);

const uploadProfileBtn =
document.getElementById(
"uploadProfileBtn"
);

const chatBtn =
document.getElementById(
"chatBtn"
);

const postBtn =
document.getElementById(
"postBtn"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);


/* POST MODAL */

const postModal =
document.getElementById(
"postModal"
);

const closePostBtn =
document.getElementById(
"closePostBtn"
);

const cancelPostBtn =
document.getElementById(
"cancelPostBtn"
);

const postText =
document.getElementById(
"postText"
);

const postFile =
document.getElementById(
"postFile"
);

const postFileName =
document.getElementById(
"postFileName"
);

const publishBtn =
document.getElementById(
"publishBtn"
);


/* MESSAGES */

const profileSuccess =
document.getElementById(
"profileSuccess"
);

const profileError =
document.getElementById(
"profileError"
);

const postSuccess =
document.getElementById(
"postSuccess"
);

const postError =
document.getElementById(
"postError"
);


let currentUser =
null;

let currentPage =
null;


/* =========================
   CHECK LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{

loading.classList.add(
"hidden"
);


if(!user){

loginRequired.classList.remove(
"hidden"
);

return;

}


currentUser =
user;


await findMyPage();

});


/* =========================
   FIND APPROVED PAGE
========================= */

async function findMyPage(){

try{

const pagesRef =
collection(
db,
"approvedPages"
);


const q =
query(

pagesRef,

where(
"ownerId",
"==",
currentUser.uid
)

);


const snapshot =
await getDocs(q);


if(snapshot.empty){

noPage.classList.remove(
"hidden"
);

return;

}


const pageDoc =
snapshot.docs[0];


currentPage = {

id:
pageDoc.id,

data:
pageDoc.data()

};


/* PAGE NAME */

pageName.innerText =
currentPage.data.pageName ||
"My Page";


/* PAGE LOGO */

if(
currentPage.data.logoURL
){

pageLogo.src =
currentPage.data.logoURL;

}


/* SHOW MANAGEMENT */

manageArea.classList.remove(
"hidden"
);


}catch(error){

console.error(
"Page loading error:",
error
);


alert(
"Could not load your page: " +
error.message
);

}

}


/* =========================
   UPLOAD PROFILE BUTTON
========================= */

uploadProfileBtn.addEventListener(
"click",
()=>{

logoFile.click();

});


/* =========================
   PROFILE IMAGE CLICK
========================= */

pageLogo.addEventListener(
"click",
()=>{

logoFile.click();

});


/* =========================
   PROFILE FILE SELECTED
========================= */

logoFile.addEventListener(
"change",
async()=>{

if(
!logoFile.files.length
){

return;

}


await uploadProfilePicture();

});


/* =========================
   UPLOAD PROFILE PICTURE
========================= */

async function uploadProfilePicture(){

if(!currentPage){

return;

}


const file =
logoFile.files[0];


if(!file){

return;

}


if(
!file.type.startsWith(
"image/"
)
){

showProfileError(
"Please select an image file."
);

return;

}


try{

uploadProfileBtn.disabled =
true;

uploadProfileBtn.innerText =
"Uploading...";


hideProfileMessages();


const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

{

method:
"POST",

body:
formData

}

);


if(!response.ok){

throw new Error(
"Profile picture upload failed."
);

}


const result =
await response.json();


const imageURL =
result.secure_url;


/* UPDATE FIRESTORE */

await updateDoc(

doc(
db,
"approvedPages",
currentPage.id
),

{

logoURL:
imageURL

}

);


/* UPDATE LOCAL DATA */

currentPage.data.logoURL =
imageURL;


pageLogo.src =
imageURL;


showProfileSuccess(
"Profile picture updated successfully!"
);


logoFile.value =
"";


}catch(error){

console.error(
"Profile picture error:",
error
);


showProfileError(
"Profile picture upload failed: " +
error.message
);

}


uploadProfileBtn.disabled =
false;

uploadProfileBtn.innerText =
"🖼️ Upload Profile Pic";

}


/* =========================
   CHAT
========================= */

chatBtn.addEventListener(
"click",
()=>{

if(!currentPage){

return;

}


/*
Pass the current page ID to chat.html.
*/

const chatURL =
"chat.html?pageId=" +
encodeURIComponent(
currentPage.id
);


window.location.href =
chatURL;

});


/* =========================
   OPEN POST
========================= */

postBtn.addEventListener(
"click",
()=>{

openPostModal();

});


/* =========================
   OPEN POST MODAL
========================= */

function openPostModal(){

postModal.classList.add(
"show"
);


hidePostMessages();


setTimeout(
()=>{

postText.focus();

},
100
);

}


/* =========================
   CLOSE POST MODAL
========================= */

function closePostModal(){

postModal.classList.remove(
"show"
);

}


/* CLOSE BUTTON */

closePostBtn.addEventListener(
"click",
closePostModal
);


/* CANCEL BUTTON */

cancelPostBtn.addEventListener(
"click",
closePostModal
);


/* =========================
   CLICK OUTSIDE MODAL
========================= */

postModal.addEventListener(
"click",
(e)=>{

if(
e.target === postModal
){

closePostModal();

}

});


/* =========================
   ESCAPE KEY
========================= */

document.addEventListener(
"keydown",
(e)=>{

if(
e.key === "Escape" &&
postModal.classList.contains(
"show"
)
){

closePostModal();

}

});


/* =========================
   SELECT POST FILE
========================= */

postFile.addEventListener(
"change",
()=>{

if(
!postFile.files.length
){

postFileName.innerText =
"";

return;

}


postFileName.innerText =
"Selected: " +
postFile.files[0].name;

});


/* =========================
   PUBLISH POST
========================= */

publishBtn.addEventListener(
"click",
async()=>{

if(!currentPage){

return;

}


const text =
postText.value.trim();

const file =
postFile.files[0];


if(!text && !file){

showPostError(
"Write something or select a photo/video."
);

return;

}


try{

publishBtn.disabled =
true;

publishBtn.innerText =
"Publishing...";


hidePostMessages();


let mediaURL =
"";

let mediaType =
"";


/* =========================
   UPLOAD MEDIA
========================= */

if(file){

if(
!file.type.startsWith(
"image/"
) &&
!file.type.startsWith(
"video/"
)
){

throw new Error(
"Please select an image or video."
);

}


const formData =
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const resourceType =
file.type.startsWith(
"video/"
)
?
"video"
:
"image";


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`,

{

method:
"POST",

body:
formData

}

);


if(!response.ok){

throw new Error(
"Media upload failed."
);

}


const result =
await response.json();


mediaURL =
result.secure_url;


mediaType =
resourceType;

}


/* =========================
   SAVE POST
========================= */

await addDoc(

collection(
db,
"posts"
),

{

pageId:
currentPage.id,

ownerId:
currentUser.uid,

pageName:
currentPage.data.pageName ||
"",

logoURL:
currentPage.data.logoURL ||
"",

text:
text,

mediaURL:
mediaURL,

mediaType:
mediaType,

createdAt:
serverTimestamp()

}

);


/* =========================
   CLEAR FORM
========================= */

postText.value =
"";

postFile.value =
"";

postFileName.innerText =
"";


showPostSuccess(
"Post published successfully!"
);


/* =========================
   CLOSE AFTER SUCCESS
========================= */

setTimeout(
()=>{

closePostModal();

hidePostMessages();

},
1200
);


}catch(error){

console.error(
"Post error:",
error
);


showPostError(
"Post failed: " +
error.message
);

}


publishBtn.disabled =
false;

publishBtn.innerText =
"📤 Publish Post";

});


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
"click",
async()=>{

try{

await signOut(
auth
);


location.href =
"login.html";


}catch(error){

alert(
"Logout failed: " +
error.message
);

}

});


/* =========================
   PROFILE MESSAGES
========================= */

function hideProfileMessages(){

profileSuccess.style.display =
"none";

profileError.style.display =
"none";

}


function showProfileSuccess(
message
){

profileSuccess.innerText =
message;

profileSuccess.style.display =
"block";

profileError.style.display =
"none";

}


function showProfileError(
message
){

profileError.innerText =
message;

profileError.style.display =
"block";

profileSuccess.style.display =
"none";

}


/* =========================
   POST MESSAGES
========================= */

function hidePostMessages(){

postSuccess.style.display =
"none";

postError.style.display =
"none";

}


function showPostSuccess(
message
){

postSuccess.innerText =
message;

postSuccess.style.display =
"block";

postError.style.display =
"none";

}


function showPostError(
message
){

postError.innerText =
message;

postError.style.display =
"block";

postSuccess.style.display =
"none";

}

</script>

</body>

     </html>
