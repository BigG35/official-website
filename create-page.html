<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Your Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0a4ea3;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#0a4ea3;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#0a4ea3;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

.successBox{
display:none;
margin:20px auto;
max-width:800px;
padding:20px;
background:#e8f5e9;
border:1px solid #4CAF50;
border-radius:8px;
text-align:center;
}

</style>

</head>

<body>

<header>

<h1>Create Your Own Page</h1>

<p>All pages must be approved by the Logical World Admin.</p>

</header>

<div class="container">

<h2>Page Information</h2>

<form id="createPageForm">

<label>Page Type</label>

<select id="pageType" required>

<option value="">Select Page Type</option>
<option>Business Page</option>
<option>Personal Page</option>
<option>Organization</option>
<option>Community</option>

</select>

<label>Page Name</label>

<input
type="text"
id="pageName"
placeholder="Enter your page name"
required>

<label>Page Logo / Profile Picture</label>

<input
type="file"
id="pageLogo"
accept="image/*"
required>

<label>Category</label>

<select id="category">

<option>Snails</option>
<option>Cars</option>
<option>Electronics</option>
<option>Fashion</option>
<option>Home Services</option>
<option>Food</option>
<option>Other</option>

</select>

<label>Description</label>

<textarea
id="description"
placeholder="Describe your business"></textarea>

<label>Phone Number</label>

<input
type="tel"
id="phone">

<label>Email</label>

<input
type="email"
id="email">

<label>Location</label>

<input
type="text"
id="location">

<label>Business Address</label>

<textarea
id="address"
placeholder="Enter your full business address"></textarea>

<label>Upload Photos</label>

<input
type="file"
id="galleryPhotos"
accept="image/*"
multiple>

<label>Upload Videos</label>

<input
type="file"
id="pageVideos"
accept="video/*"
multiple>

<label style="display:flex;align-items:center;gap:10px;margin-top:20px;">

<input
type="checkbox"
id="terms"
required>

<span>
I agree to the Logical World Terms & Conditions and understand that my page will be reviewed before it becomes public.
</span>

</label>

<button type="submit">

Submit For Approval

</button>

</form>

</div>

<div id="submitMessage" class="successBox">

<h3>✅ Page Submitted Successfully</h3>

<p>Your page has been sent to the Logical World Admin.</p>

<p>It will remain hidden until it is approved.</p>

  </div>
  <script type="module">

import { db, storage } from "./firebase.js";

import {
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";

const form = document.getElementById("createPageForm");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  try {

    const logoFile =
      document.getElementById("pageLogo").files[0];

    if (!logoFile) {
      alert("Please select a page logo.");
      return;
    }

    /* Upload logo */

    const logoRef = ref(
      storage,
      "pageLogos/" + Date.now() + "_" + logoFile.name
    );

    await uploadBytes(logoRef, logoFile);

    const logoURL =
      await getDownloadURL(logoRef);

    /* Save page to Firestore */

    const pageData = {

      pageType:
        document.getElementById("pageType").value,

      pageName:
        document.getElementById("pageName").value,

      category:
        document.getElementById("category").value,

      description:
        document.getElementById("description").value,

      phone:
        document.getElementById("phone").value,

      email:
        document.getElementById("email").value,

      location:
        document.getElementById("location").value,

      address:
        document.getElementById("address").value,

      logoURL: logoURL,

      status: "Pending",

      createdAt: new Date()

    };

    await addDoc(
      collection(db, "pendingPages"),
      pageData
    );

    form.style.display = "none";

    document.getElementById(
      "submitMessage"
    ).style.display = "block";

  } catch (error) {

    console.error(error);

    alert(
      "Error submitting page: " +
      error.message
    );

  }

});

</script>

</body>
  </html>
