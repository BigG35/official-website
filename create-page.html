<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Page - Logical World</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

header{
background:#0a4ea3;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:700px;
margin:30px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
color:#0a4ea3;
text-align:center;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
margin-top:20px;
padding:15px;
background:#0a4ea3;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#083d82;
}
</style>

</head>

<body>

<header>
<h1>Create Your Own Page</h1>
<p>All pages must be approved by the Logical World Admin.</p>
</header>

<div class="container">

<h2>Page Information</h2>

<form>
<label>Page Type</label>

<select>
<option value="">Select Page Type</option>
<option>Business Page</option>
<option>Personal Page</option>
<option>Organization</option>
<option>Community</option>
  </select>
<label>Page Name</label>
<input type="text" placeholder="Enter your page name">
<label>Page Logo / Profile Picture</label>
<input type="file" accept="image/*">
<label>Category</label>
<select>
<option>Snails</option>
<option>Cars</option>
<option>Electronics</option>
<option>Fashion</option>
<option>Home Services</option>
<option>Food</option>
<option>Other</option>
</select>

<label>Description</label>
<textarea placeholder="Describe your business"></textarea>

<label>Phone Number</label>
<input type="tel">

<label>Email</label>
<input type="email">

<label>Location</label>
<input type="text">

<label>Upload Photos</label>
<input type="file" multiple>

<label>Upload Videos</label>
<input type="file" multiple>

<button type="submit">
Submit For Approval
</button>

</form>

</div>

</body>
  </html>
  <div id="submitMessage" style="display:none;margin-top:20px;padding:15px;background:#e8f5e9;border:1px solid #4CAF50;border-radius:8px;text-align:center;">

<h3>✅ Page Submitted Successfully</h3>

<p>
Your page has been sent to the Logical World Admin.
</p>

<p>
It will remain hidden until it is approved.
</p>

</div>

<script>
const form=document.querySelector("form");

form.addEventListener("submit",function(e){
e.preventDefault();

document.getElementById("submitMessage").style.display="block";

form.reset();

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});
});
  </script>
