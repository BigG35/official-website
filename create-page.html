<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Your Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0a4ea3;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#0a4ea3;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#0a4ea3;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#083d82;
}

.loginMessage{
display:none;
text-align:center;
padding:25px;
}

.successBox{
display:none;
margin:20px auto;
max-width:800px;
padding:20px;
background:#e8f5e9;
border:1px solid #4CAF50;
border-radius:8px;
text-align:center;
}

</style>

</head>


<body>


<header>

<h1>Create Your Own Page</h1>

<p>
All pages must be approved by the Logical World Admin.
</p>

</header>


<div
id="loginMessage"
class="container loginMessage"
>

<h2>Login Required</h2>

<p>
You must login before creating a page.
</p>

<button
onclick="location.href='login.html'"
>
Go To Login
</button>

</div>


<div
id="formContainer"
class="container"
style="display:none;"
>

<h2>
Page Information
</h2>


<form id="createPageForm">


<label>
Page Type
</label>

<select
id="pageType"
required
>

<option value="">
Select Page Type
</option>

<option value="Business Page">
Business Page
</option>

<option value="Personal Page">
Personal Page
</option>

<option value="Organization">
Organization
</option>

<option value="Community">
Community
</option>

</select>


<label>
Page Name
</label>

<input
type="text"
id="pageName"
placeholder="Enter your page name"
required
>


<label>
Page Logo / Profile Picture
</label>

<input
type="file"
id="pageLogo"
accept="image/*"
required
>


<label>
Category
</label>

<select id="category">

<option>
Snails
</option>

<option>
Cars
</option>

<option>
Electronics
</option>

<option>
Fashion
</option>

<option>
Home Services
</option>

<option>
Food
</option>

<option>
Other
</option>

</select>


<label>
Description
</label>

<textarea
id="description"
placeholder="Describe your business"
></textarea>


<label>
Phone Number
</label>

<input
type="tel"
id="phone"
>


<label>
Email
</label>

<input
type="email"
id="email"
>


<label>
Location
</label>

<input
type="text"
id="location"
>


<label>
Business Address
</label>

<textarea
id="address"
placeholder="Enter your full business address"
></textarea>


<label>
Upload Photos
</label>

<input
type="file"
id="galleryPhotos"
accept="image/*"
multiple
>


<label>
Upload Videos
</label>

<input
type="file"
id="pageVideos"
accept="video/*"
multiple
>


<label
style="
display:flex;
align-items:center;
gap:10px;
margin-top:20px;
"
>

<input
type="checkbox"
id="terms"
required
>

<span>

I agree to the Logical World Terms & Conditions
and understand that my page will be reviewed
before it becomes public.

</span>

</label>


<button
type="submit"
id="submitButton"
>

Submit For Approval

</button>


</form>

</div>


<div
id="submitMessage"
class="successBox"
>

<h3>
✅ Page Submitted Successfully
</h3>

<p>
Your page has been sent to the Logical World Admin.
</p>

<p>
It will remain hidden until it is approved.
</p>

</div>


<script type="module">


import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
addDoc,
updateDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
"rkcnhhdb";

const CLOUDINARY_UPLOAD_PRESET =
"logicalworld_pages";


/* =========================
   ELEMENTS
========================= */

const formContainer =
document.getElementById(
"formContainer"
);

const loginMessage =
document.getElementById(
"loginMessage"
);

const form =
document.getElementById(
"createPageForm"
);

const submitButton =
document.getElementById(
"submitButton"
);


/* =========================
   CHECK LOGIN
========================= */

let currentUser = null;


onAuthStateChanged(
auth,
(user)=>{

if(user){

currentUser = user;

loginMessage.style.display =
"none";

formContainer.style.display =
"block";

}else{

currentUser = null;

formContainer.style.display =
"none";

loginMessage.style.display =
"block";

}

}
);


/* =========================
   CREATE PAGE
========================= */

form.addEventListener(
"submit",
async(e)=>{

e.preventDefault();


if(!currentUser){

alert(
"Please login first."
);

location.href =
"login.html";

return;

}


try{


submitButton.disabled =
true;

submitButton.innerText =
"Submitting...";


/* =========================
   BASIC PAGE DATA
========================= */

const pageData = {

ownerId:
currentUser.uid,

ownerEmail:
currentUser.email || "",

pageType:
document.getElementById(
"pageType"
).value,

pageName:
document.getElementById(
"pageName"
).value.trim(),

category:
document.getElementById(
"category"
).value,

description:
document.getElementById(
"description"
).value.trim(),

phone:
document.getElementById(
"phone"
).value.trim(),

email:
document.getElementById(
"email"
).value.trim(),

location:
document.getElementById(
"location"
).value.trim(),

address:
document.getElementById(
"address"
).value.trim(),

status:
"Pending",

createdAt:
serverTimestamp()

};


/* =========================
   CREATE PENDING PAGE
========================= */

const pageRef =
await addDoc(

collection(
db,
"pendingPages"
),

pageData

);


/* =========================
   UPLOAD LOGO
========================= */

const logoFile =
document.getElementById(
"pageLogo"
).files[0];


if(logoFile){

const uploadData =
new FormData();


uploadData.append(
"file",
logoFile
);


uploadData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

{
method:"POST",
body:uploadData
}

);


if(!response.ok){

throw new Error(
"Logo upload failed."
);

}


const result =
await response.json();


await updateDoc(

doc(
db,
"pendingPages",
pageRef.id
),

{

logoURL:
result.secure_url

}

);

}


/* =========================
   UPLOAD GALLERY PHOTOS
========================= */

const galleryFiles =
document.getElementById(
"galleryPhotos"
).files;


const photoURLs = [];


for(
const photoFile of galleryFiles
){

const photoData =
new FormData();


photoData.append(
"file",
photoFile
);


photoData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const photoResponse =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

{
method:"POST",
body:photoData
}

);


if(!photoResponse.ok){

throw new Error(
"Photo upload failed."
);

}


const photoResult =
await photoResponse.json();


photoURLs.push(
photoResult.secure_url
);

}


/* SAVE PHOTO URLS */

if(photoURLs.length > 0){

await updateDoc(

doc(
db,
"pendingPages",
pageRef.id
),

{

photos:
photoURLs

}

);

}


/* =========================
   SUCCESS
========================= */

form.style.display =
"none";


document.getElementById(
"submitMessage"
).style.display =
"block";


alert(
"Page submitted successfully!"
);


}catch(error){

console.error(
"Page submission error:",
error
);


alert(
"Submission error: " +
error.message
);


submitButton.disabled =
false;

submitButton.innerText =
"Submit For Approval";

}

});


</script>


</body>
  </html>
