<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Your Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0a4ea3;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#0a4ea3;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#0a4ea3;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#083d82;
}

.successBox{
display:none;
margin-top:20px;
padding:15px;
background:#e8f5e9;
border:1px solid #4CAF50;
border-radius:8px;
text-align:center;
}

</style>

</head>

<body>

<header>

<h1>Create Your Own Page</h1>

<p>All pages must be approved by the Logical World Admin.</p>

</header>

<div class="container">

<h2>Page Information</h2>

<form id="createPageForm">

<label>Page Type</label>

<select id="pageType" required>

<option value="">Select Page Type</option>

<option>Business Page</option>

<option>Personal Page</option>

<option>Organization</option>

<option>Community</option>

</select>

<label>Page Name</label>

<input
type="text"
id="pageName"
placeholder="Enter your page name"
required>

<label>Page Logo / Profile Picture</label>

<input
type="file"
id="pageLogo"
accept="image/*">

<label>Category</label>

<select id="category">

<option>Snails</option>
<option>Cars</option>
<option>Electronics</option>
<option>Fashion</option>
<option>Home Services</option>
<option>Food</option>
<option>Other</option>

</select>

<label>Description</label>

<textarea
id="description"
placeholder="Describe your business"></textarea>
  <label>Phone Number</label>
<input type="tel" id="phone">

<label>Email</label>
<input type="email" id="email">

<label>Location</label>
<input type="text" id="location">

<label>Business Address</label>
<textarea id="address" placeholder="Enter your full business address"></textarea>

<label>Upload Photos</label>
<input type="file" multiple>

<label>Upload Videos</label>
<input type="file" multiple>

<label style="display:flex;align-items:center;gap:10px;margin-top:20px;">
<input type="checkbox" required>
<span>
I agree to the Logical World Terms & Conditions and understand that my page will be reviewed before it becomes public.
</span>
</label>

<button type="submit">
Submit For Approval
</button>

<p id="pageStatus" style="margin-top:15px;color:#0a4ea3;font-weight:bold;">
Status: Pending Admin Approval
</p>

</form>

</div>

<div id="submitMessage" style="display:none;margin-top:20px;padding:15px;background:#e8f5e9;border:1px solid #4CAF50;border-radius:8px;text-align:center;">

<h3>✅ Page Submitted Successfully</h3>

<p>Your page has been sent to the Logical World Admin.</p>

<p>It will remain hidden until it is approved.</p>

</div>

<script type="module">

alert("JavaScript is running");
const form = document.getElementById("createPageForm");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  try {

    await addDoc(collection(db, "pendingPages"), {

      pageName: document.getElementById("pageName").value,

      category: document.getElementById("category").value,

      description: document.getElementById("description").value,

      phone: document.getElementById("phone").value,

      email: document.getElementById("email").value,

      location: document.getElementById("location").value,

      address: document.getElementById("address").value,

      status: "Pending",

      createdAt: new Date()

    });

    document.getElementById("submitMessage").style.display = "block";

    form.reset();

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  } catch (error) {

    alert("Error submitting page: " + error.message);

    console.error(error);

  }

});

</script>

</body>
</html>
