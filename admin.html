<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logical World Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#083d82;
padding:15px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
}

nav a{
color:white;
text-decoration:none;
padding:10px 15px;
background:#0a4ea3;
border-radius:5px;
}

nav a:hover{
background:#083d82;
}

.container{
max-width:1200px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.card h2{
color:#0a4ea3;
margin-bottom:15px;
}

.card h3{
color:#0a4ea3;
margin-bottom:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.stat-box{
background:#0a4ea3;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
}

.stat-box h2{
color:white;
margin-bottom:5px;
}

button{
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
margin:5px;
}

.approve{
background:green;
color:white;
}

.reject{
background:red;
color:white;
}

.delete{
background:black;
color:white;
}

.refresh{
background:#0a4ea3;
color:white;
padding:12px 20px;
}

footer{
text-align:center;
padding:20px;
margin-top:30px;
background:#0a4ea3;
color:white;
}

.page-logo{
width:100px;
height:100px;
object-fit:cover;
border-radius:50%;
margin-bottom:10px;
}

</style>

</head>

<body>

<header>

<h1>Logical World Admin Dashboard</h1>

<p>Manage Pages, Users and Website</p>

</header>

<nav>

<a href="admin.html">🏠 Dashboard</a>

<a href="admin.html">📋 Pending Pages</a>

<a href="approved-pages.html">✅ Approved Pages</a>

<a href="rejected-pages.html">❌ Rejected Pages</a>

<a href="users.html">👥 Users</a>

<a href="settings.html">⚙️ Settings</a>

<a href="login.html">🚪 Logout</a>

</nav>

<div class="container">

<div class="stats">

<div class="stat-box">

<h2 id="pendingCount">0</h2>

<p>Pending Pages</p>

</div>

<div class="stat-box">

<h2 id="approvedCount">0</h2>

<p>Approved Pages</p>

</div>

<div class="stat-box">

<h2 id="usersCount">0</h2>

<p>Users</p>

</div>

<div class="stat-box">

<h2 id="reportsCount">0</h2>

<p>Reports</p>

</div>

<div class="stat-box">

<h2 id="totalPagesCount">0</h2>

<p>Total Pages</p>

</div>

</div>

<div style="text-align:right;margin:20px 0;">

<button
class="refresh"
id="refreshButton"
>
🔄 Refresh Dashboard
</button>

</div>

<div class="card">

<h2>Pending Approval</h2>

<input
type="text"
id="searchPages"
placeholder="🔍 Search pages..."
style="
width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ccc;
border-radius:5px;
">

<label>
<strong>Sort By</strong>
</label>

<select
id="sortPages"
style="
width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ccc;
border-radius:5px;
">

<option value="newest">
Newest First
</option>

<option value="oldest">
Oldest First
</option>

<option value="az">
Business Name (A-Z)
</option>

<option value="za">
Business Name (Z-A)
</option>

<option value="location">
Location
</option>

</select>

<div id="pendingPagesList"></div>

</div>

<footer>

© 2026 Logical World Admin Panel

</footer>

</div>

<script type="module">

import { auth } from "./firebase.js";

import { db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
collection,
getDocs,
addDoc,
deleteDoc,
doc,
getCountFromServer
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   ADMIN LOGIN PROTECTION
========================= */

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="login.html";

return;

}

if(user.email!=="alagoagodstime@gmail.com"){

alert("Access Denied!");

location.href="index.html";

}

});


/* =========================
   ELEMENTS
========================= */

const pendingPagesList =
document.getElementById("pendingPagesList");

const searchPages =
document.getElementById("searchPages");

const sortPages =
document.getElementById("sortPages");

const refreshButton =
document.getElementById("refreshButton");


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard(){

try{

const pendingRef =
collection(db,"pendingPages");

const snapshot =
await getDocs(pendingRef);

let pages = [];

snapshot.forEach((page)=>{

pages.push({

id:page.id,

data:page.data()

});

});


/* =========================
   SEARCH
========================= */

const searchText =
searchPages.value
.toLowerCase()
.trim();

if(searchText){

pages = pages.filter((page)=>{

const data = page.data;

return (

(data.pageName || "")
.toLowerCase()
.includes(searchText)

||

(data.category || "")
.toLowerCase()
.includes(searchText)

||

(data.location || "")
.toLowerCase()
.includes(searchText)

);

});

}


/* =========================
   SORT
========================= */

const sortValue =
sortPages.value;

pages.sort((a,b)=>{

const dataA = a.data;
const dataB = b.data;

if(sortValue === "az"){

return (dataA.pageName || "")
.localeCompare(dataB.pageName || "");

}

if(sortValue === "za"){

return (dataB.pageName || "")
.localeCompare(dataA.pageName || "");

}

if(sortValue === "location"){

return (dataA.location || "")
.localeCompare(dataB.location || "");

}

if(sortValue === "oldest"){

return getTime(dataA.createdAt)
-
getTime(dataB.createdAt);

}

return getTime(dataB.createdAt)
-
getTime(dataA.createdAt);

});


/* =========================
   DISPLAY PENDING PAGES
========================= */

pendingPagesList.innerHTML = "";


if(pages.length === 0){

pendingPagesList.innerHTML = `

<p style="
text-align:center;
padding:20px;
">

No pending pages found.

</p>

`;

}else{

pages.forEach((page)=>{

const data = page.data;


/* Logo */

const logoHTML =
data.logoURL

?

`

<img
src="${data.logoURL}"
class="page-logo"
alt="Page Logo"
>

`

:

"";


pendingPagesList.innerHTML += `

<div class="card">

${logoHTML}

<h3>
${escapeHTML(data.pageName || "")}
</h3>

<p>
<strong>Page Type:</strong>
${escapeHTML(data.pageType || "")}
</p>

<p>
<strong>Category:</strong>
${escapeHTML(data.category || "")}
</p>

<p>
<strong>Description:</strong>
${escapeHTML(data.description || "")}
</p>

<p>
<strong>Phone:</strong>
${escapeHTML(data.phone || "")}
</p>

<p>
<strong>Email:</strong>
${escapeHTML(data.email || "")}
</p>

<p>
<strong>Location:</strong>
${escapeHTML(data.location || "")}
</p>

<p>
<strong>Address:</strong>
${escapeHTML(data.address || "")}
</p>

<p>
<strong>Status:</strong>
${escapeHTML(data.status || "Pending")}
</p>

<button
class="approve"
data-id="${page.id}"
>
✅ Approve
</button>

<button
class="reject"
data-id="${page.id}"
>
❌ Reject
</button>

<button
class="delete"
data-id="${page.id}"
>
🗑 Delete
</button>

</div>

`;

});

}


/* =========================
   COUNTERS
========================= */

const pendingCount =
await getCountFromServer(
collection(db,"pendingPages")
);

document.getElementById(
"pendingCount"
).innerText =
pendingCount.data().count;


const approvedCount =
await getCountFromServer(
collection(db,"approvedPages")
);

document.getElementById(
"approvedCount"
).innerText =
approvedCount.data().count;


document.getElementById(
"totalPagesCount"
).innerText =

pendingCount.data().count
+
approvedCount.data().count;


/*

Users and reports can be connected
later when those collections exist.

*/

document.getElementById(
"usersCount"
).innerText = "0";

document.getElementById(
"reportsCount"
).innerText = "0";


}catch(error){

console.error(
"Dashboard error:",
error
);

alert(
"Dashboard error: "
+
error.message
);

}

}


/* =========================
   APPROVE / REJECT / DELETE
========================= */

document.addEventListener(
"click",
async(e)=>{

const id =
e.target.dataset.id;

if(!id){

return;

}


try{

/* Get current pending document */

const pageRef =
doc(db,"pendingPages",id);

const pageSnap =
await getDocs(
collection(db,"pendingPages")
);

let selectedData = null;

pageSnap.forEach((item)=>{

if(item.id === id){

selectedData =
item.data();

}

});


if(!selectedData){

alert(
"Page could not be found."
);

return;

}


/* =========================
   APPROVE
========================= */

if(
e.target.classList.contains("approve")
){

const approvedData = {

...selectedData,

status:"Approved",

approvedAt:new Date()

};


/*

This keeps everything from the
pending page, including:

logoURL
pageName
category
description
phone
email
location
address

*/

await addDoc(

collection(
db,
"approvedPages"
),

approvedData

);


/* Remove from pending */

await deleteDoc(

pageRef

);

alert(
"Approved Successfully"
);

await loadDashboard();

return;

}


/* =========================
   REJECT
========================= */

if(
e.target.classList.contains("reject")
){

const rejectedData = {

...selectedData,

status:"Rejected",

rejectedAt:new Date()

};


await addDoc(

collection(
db,
"rejectedPages"
),

rejectedData

);


await deleteDoc(

pageRef

);

alert(
"Rejected Successfully"
);

await loadDashboard();

return;

}


/* =========================
   DELETE
========================= */

if(
e.target.classList.contains("delete")
){

if(
confirm(
"Delete this page permanently?"
)
){

await deleteDoc(
pageRef
);

alert(
"Deleted Successfully"
);

await loadDashboard();

}

}

}catch(error){

console.error(
"Action error:",
error
);

alert(
"Action failed: "
+
error.message
);

}

});


/* =========================
   REFRESH
========================= */

refreshButton.addEventListener(
"click",
loadDashboard
);


/* =========================
   SEARCH + SORT
========================= */

searchPages.addEventListener(
"input",
loadDashboard
);

sortPages.addEventListener(
"change",
loadDashboard
);


/* =========================
   HELPERS
========================= */

function getTime(timestamp){

if(!timestamp){

return 0;

}

if(
typeof timestamp.toMillis === "function"
){

return timestamp.toMillis();

}

return 0;

}


function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadDashboard();

</script>

</body>

</html>
