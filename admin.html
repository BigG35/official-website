<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logical World Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#083d82;
padding:15px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
}

nav a{
color:white;
text-decoration:none;
padding:10px 15px;
background:#0a4ea3;
border-radius:5px;
}

.container{
max-width:1200px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.card h2{
color:#0a4ea3;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.stat-box{
background:#0a4ea3;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
}

button{
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
margin:5px;
}

.approve{
background:green;
color:white;
}

.reject{
background:red;
color:white;
}

.delete{
background:black;
color:white;
}

footer{
text-align:center;
padding:20px;
margin-top:30px;
background:#0a4ea3;
color:white;
}

</style>

</head>

<body>

<header>

<h1>Logical World Admin Dashboard</h1>

<p>Manage Pages, Users and Website</p>

</header>

<nav>

<nav>

<a href="admin.html">🏠 Dashboard</a>

<a href="admin.html">📋 Pending Pages</a>

<a href="approved-pages.html">✅ Approved Pages</a>

<a href="rejected-pages.html">❌ Rejected Pages</a>

<a href="users.html">👥 Users</a>

<a href="settings.html">⚙️ Settings</a>

<a href="login.html">🚪 Logout</a>

</nav>

<div class="container">

<div class="stats">

<div class="stat-box">

<h2 id="pendingCount">0</h2>
<p>Pending Pages</p>

</div>

<div class="stat-box">

<h2 id="approvedCount">0</h2>
<p>Approved Pages</p>

</div>

<div class="stat-box">

<h2 id="usersCount">0</h2>
<p>Users</p>

</div>

<div class="stat-box">

  <h2 id="reportsCount">0</h2>
<p>Reports</p>

</div>
<div class="stat-box">


<h2 id="totalPagesCount">0</h2>
<p>Total Pages</p>

</div>
</div>
<div style="text-align:right;margin:20px 0;">

<button style="
background:#0a4ea3;
color:white;
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;">

🔄 Refresh Dashboard

</button>

</div>
<div class="card">

<h2>Pending Approval</h2>
<input
type="text"
placeholder="🔍 Search pages..."
  <label><strong>Filter Status</strong></label>
<label><strong>Sort By</strong></label>

<select style="width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ccc;
border-radius:5px;">

<option>Newest First</option>
<option>Oldest First</option>
<option>Business Name (A-Z)</option>
<option>Business Name (Z-A)</option>
<option>Location</option>

  </select>
<select style="width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ccc;
border-radius:5px;">

<option>All Pages</option>
<option>Pending Approval</option>
<option>Approved</option>
<option>Rejected</option>

  </select>
<div id="pendingPagesList"></div>

</div>

<footer>

© 2026 Logical World Admin Panel

</footer>

</div>
<script type="module">
import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="login.html";

return;

}

if(user.email!=="alagoagodstime@gmail.com"){

alert("Access Denied!");

location.href="index.html";

}

});
import { db } from "./firebase.js";

import {
collection,
getDocs,
addDoc,
deleteDoc,
doc,
getCountFromServer
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const pendingRef = collection(db,"pendingPages");

const pendingPagesList = document.getElementById("pendingPagesList");

const snapshot = await getDocs(pendingRef);

pendingPagesList.innerHTML = "";

snapshot.forEach((page)=>{

const data = page.data();

pendingPagesList.innerHTML += `

<div class="card">

<h3>${data.pageName}</h3>

<p><strong>Category:</strong> ${data.category}</p>

<p><strong>Description:</strong> ${data.description}</p>

<p><strong>Phone:</strong> ${data.phone}</p>

<p><strong>Email:</strong> ${data.email}</p>

<p><strong>Location:</strong> ${data.location}</p>

<button class="approve" data-id="${page.id}">✅ Approve</button>

<button class="reject" data-id="${page.id}">❌ Reject</button>

<button class="delete" data-id="${page.id}">🗑 Delete</button>

</div>

`;

});

const pendingCount =
await getCountFromServer(collection(db,"pendingPages"));

document.getElementById("pendingCount").innerText =
pendingCount.data().count;

const approvedCount =
await getCountFromServer(collection(db,"approvedPages"));

document.getElementById("approvedCount").innerText =
approvedCount.data().count;

document.getElementById("totalPagesCount").innerText =
pendingCount.data().count + approvedCount.data().count;

document.addEventListener("click", async(e)=>{
console.log(e.target);
const id = e.target.dataset.id;

if(!id) return;

const page =
snapshot.docs.find(d=>d.id===id);

if(!page) return;

const data = page.data();
if(e.target.classList.contains("approve")){

const approvedData = {
  ...data,
  status: "Approved",
  approvedAt: new Date()
};

await addDoc(
  collection(db,"approvedPages"),
  approvedData
);

await deleteDoc(
  doc(db,"pendingPages",id)
);

alert("Approved Successfully");

location.reload();

}

alert("Approved Successfully");

location.reload();

}

if(e.target.classList.contains("reject")){

await addDoc(collection(db,"rejectedPages"),data);

await deleteDoc(doc(db,"pendingPages",id));

alert("Rejected Successfully");

location.reload();

}

if(e.target.classList.contains("delete")){

if(confirm("Delete this page permanently?")){

await deleteDoc(doc(db,"pendingPages",id));

alert("Deleted Successfully");

location.reload();

}

}

});

</script>
</body>
</html>
