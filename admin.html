<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logical World Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#083d82;
padding:15px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
}

nav a{
color:white;
text-decoration:none;
padding:10px 15px;
background:#0a4ea3;
border-radius:5px;
}

.container{
max-width:1200px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.card h2{
color:#0a4ea3;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.stat-box{
background:#0a4ea3;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
}

button{
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
margin:5px;
}

.approve{
background:green;
color:white;
}

.reject{
background:red;
color:white;
}

.delete{
background:black;
color:white;
}

footer{
text-align:center;
padding:20px;
margin-top:30px;
background:#0a4ea3;
color:white;
}

</style>

</head>

<body>

<header>

<h1>Logical World Admin Dashboard</h1>

<p>Manage Pages, Users and Website</p>

</header>

<nav>

<a href="#">Dashboard</a>

<a href="#">Pending Pages</a>

<a href="#">Approved Pages</a>

<a href="#">Rejected Pages</a>

<a href="#">Users</a>

<a href="#">Settings</a>

<a href="#">Logout</a>

</nav>

<div class="container">

<div class="stats">

<div class="stat-box">

<h2>0</h2>

<p>Pending Pages</p>

</div>

<div class="stat-box">

<h2>0</h2>

<p>Approved Pages</p>

</div>

<div class="stat-box">

<h2>0</h2>

<p>Users</p>

</div>

<div class="stat-box">

<h2>0</h2>

<p>Reports</p>

</div>

</div>

<div class="card">

<h2>Pending Approval</h2>

<p>No pages waiting for approval.</p>

<button class="approve">Approve</button>

<button class="reject">Reject</button>

<button class="delete">Delete</button>

</div>

<footer>

© 2026 Logical World Admin Panel

</footer>

</div>

</body>
</html>
