<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f2f5;
color:#222;
}

header{
background:#0a4ea3;
color:white;
padding:18px;
text-align:center;
}

.page{
max-width:700px;
margin:20px auto;
}

.profile{
background:white;
border-radius:10px;
padding:25px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #0a4ea3;
}

.name{
color:#0a4ea3;
font-size:28px;
margin-top:12px;
}

.new-post{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.new-post h2{
color:#0a4ea3;
margin-bottom:15px;
}

textarea{
width:100%;
height:110px;
padding:12px;
border:1px solid #ccc;
border-radius:7px;
resize:vertical;
font-size:16px;
}

input[type="file"]{
width:100%;
margin-top:15px;
}

.post-button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:7px;
background:#0a4ea3;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.post-button:hover{
background:#083d82;
}

.post{
background:white;
margin-top:20px;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.post-header{
display:flex;
align-items:center;
gap:12px;
margin-bottom:15px;
}

.post-logo{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.post-name{
font-weight:bold;
color:#0a4ea3;
}

.post-text{
font-size:17px;
margin-bottom:15px;
white-space:pre-wrap;
}

.post-image{
width:100%;
max-height:500px;
object-fit:contain;
border-radius:8px;
background:#eee;
}

.message{
text-align:center;
padding:30px;
font-size:18px;
color:#666;
}

.logout{
display:inline-block;
margin-top:15px;
padding:10px 18px;
background:#555;
color:white;
text-decoration:none;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<h1>🌍 Logical World</h1>

<p>My Page</p>

</header>


<div id="message" class="message">

Loading your page...

</div>


<div
id="pageContent"
class="page"
style="display:none;"
>


<!-- PROFILE -->

<div class="profile">

<img
id="businessLogo"
class="logo"
src="images/default-logo.png"
alt="Logo"
>

<h1
id="businessName"
class="name"
>
Business Name
</h1>

<a
href="login.html"
class="logout"
id="logoutButton"
>
Logout
</a>

</div>


<!-- NEW POST -->

<div class="new-post">

<h2>
📝 New Post
</h2>

<textarea
id="postText"
placeholder="Write something about your post..."
></textarea>

<input
type="file"
id="postImage"
accept="image/*,video/*"
>

<button
class="post-button"
id="postButton"
>
📤 Post
</button>

</div>


<!-- POSTS -->

<div id="postsList">

</div>


</div>


<script type="module">

import { auth, db }
from "./firebase.js";


import {
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
collection,
query,
where,
getDocs,
addDoc,
orderBy,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
"rkcnhhdb";

const CLOUDINARY_UPLOAD_PRESET =
"logicalworld_pages";


/* =========================
   ELEMENTS
========================= */

const message =
document.getElementById("message");

const pageContent =
document.getElementById("pageContent");

const businessLogo =
document.getElementById("businessLogo");

const businessName =
document.getElementById("businessName");

const postText =
document.getElementById("postText");

const postImage =
document.getElementById("postImage");

const postButton =
document.getElementById("postButton");

const postsList =
document.getElementById("postsList");


let currentUser = null;

let currentPage = null;


/* =========================
   CHECK LOGIN
========================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

message.innerText =
"Please login first.";

setTimeout(
()=>{
location.href="login.html";
},
1000
);

return;

}

currentUser = user;

await loadMyPage();

}
);


/* =========================
   LOAD OWNER PAGE
========================= */

async function loadMyPage(){

try{

const pagesRef =
collection(
db,
"approvedPages"
);

const pageQuery =
query(
pagesRef,
where(
"ownerId",
"==",
currentUser.uid
)
);

const snapshot =
await getDocs(
pageQuery
);


if(snapshot.empty){

message.innerText =
"You do not have an approved page yet.";

return;

}


/* USE FIRST APPROVED PAGE */

const pageDoc =
snapshot.docs[0];

currentPage = {

id:pageDoc.id,
data:pageDoc.data()

};


const data =
currentPage.data;


/* PROFILE */

businessName.innerText =
data.pageName || "My Page";


if(data.logoURL){

businessLogo.src =
data.logoURL;

}


/* SHOW PAGE */

message.style.display =
"none";

pageContent.style.display =
"block";


/* LOAD POSTS */

await loadPosts();

}catch(error){

console.error(error);

message.innerText =
"Error loading your page.";

}

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

postsList.innerHTML = "";


try{

const postsRef =
collection(
db,
"posts"
);

const postsQuery =
query(
postsRef,
where(
"pageId",
"==",
currentPage.id
)
);

const snapshot =
await getDocs(
postsQuery
);


if(snapshot.empty){

postsList.innerHTML = `

<div class="post">

<p style="text-align:center;color:#666;">

No posts yet.

Create your first post above.

</p>

</div>

`;

return;

}


/* DISPLAY POSTS */

const posts = [];

snapshot.forEach(
(postDoc)=>{

posts.push({
id:postDoc.id,
data:postDoc.data()
});

});


/* NEWEST FIRST */

posts.sort(
(a,b)=>
getTime(b.data.createdAt)
-
getTime(a.data.createdAt)
);


posts.forEach(
(post)=>{

const data =
post.data;


/* MEDIA */

let mediaHTML = "";


if(data.mediaURL){

if(
data.mediaType === "video"
){

mediaHTML = `

<video
class="post-image"
controls
src="${data.mediaURL}"
>
</video>

`;

}else{

mediaHTML = `

<img
class="post-image"
src="${data.mediaURL}"
alt="Post"
>
`;

}

}


/* POST */

postsList.innerHTML += `

<div class="post">

<div class="post-header">

<img
class="post-logo"
src="${
data.logoURL ||
"images/default-logo.png"
}"
alt="Logo"
>

<div>

<div class="post-name">

${escapeHTML(
data.pageName || ""
)}

</div>

</div>

</div>


<div class="post-text">

${escapeHTML(
data.text || ""
)}

</div>


${mediaHTML}

</div>

`;

});

}catch(error){

console.error(
"Post loading error:",
error
);

postsList.innerHTML = `

<div class="post">

<p>
Unable to load posts.
</p>

</div>

`;

}

}


/* =========================
   CREATE POST
========================= */

postButton.addEventListener(
"click",
async()=>{

if(!currentUser || !currentPage){

return;

}


const text =
postText.value.trim();

const file =
postImage.files[0];


if(!text && !file){

alert(
"Write something or select a photo/video."
);

return;

}


try{

postButton.disabled =
true;

postButton.innerText =
"Posting...";


let mediaURL = "";

let mediaType = "";


/* =========================
   UPLOAD MEDIA
========================= */

if(file){

const uploadData =
new FormData();


uploadData.append(
"file",
file
);

uploadData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


/* VIDEO OR IMAGE */

mediaType =
file.type.startsWith("video/")
?
"video"
:
"image";


const resourceType =
mediaType === "video"
?
"video"
:
"image";


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`,

{
method:"POST",
body:uploadData
}

);


if(!response.ok){

throw new Error(
"Media upload failed."
);

}


const result =
await response.json();


mediaURL =
result.secure_url;

}


/* =========================
   SAVE POST
========================= */

await addDoc(

collection(
db,
"posts"
),

{

pageId:
currentPage.id,

ownerId:
currentUser.uid,

pageName:
currentPage.data.pageName || "",

logoURL:
currentPage.data.logoURL || "",

text:text,

mediaURL:
mediaURL,

mediaType:
mediaType,

createdAt:
serverTimestamp()

}

);


/* CLEAR */

postText.value = "";

postImage.value = "";


/* RELOAD */

await loadPosts();


alert(
"Post published successfully!"
);


}catch(error){

console.error(
"Post error:",
error
);

alert(
"Post failed: " +
error.message
);

}


postButton.disabled =
false;

postButton.innerText =
"📤 Post";

}
);


/* =========================
   LOGOUT
========================= */

document.getElementById(
"logoutButton"
).addEventListener(
"click",
async(e)=>{

e.preventDefault();

await signOut(auth);

location.href =
"login.html";

}
);


/* =========================
   HELPERS
========================= */

function getTime(timestamp){

if(!timestamp){

return 0;

}

if(
typeof timestamp.toMillis ===
"function"
){

return timestamp.toMillis();

}

return 0;

}


function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>

</body>
  </html>
