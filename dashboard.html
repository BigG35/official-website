<!DOCTYPE html>
<html>
<head>
<title>Logical World - Owner Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 8px #ccc;
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#0a4ea3;
color:white;
border:none;
border-radius:6px;
font-size:16px;
}
</style>

</head>

<body>

<header>
<h1>🌍 Logical World</h1>
<p>Owner Dashboard</p>
</header>

<div class="grid">

<div class="card">
<h2>👥 Members</h2>
<p>0</p>
<button>Manage Members</button>
</div>

<div class="card">
<h2>👨‍💼 Staff</h2>
<p>0</p>
<button>Manage Staff</button>
</div>

<div class="card">
<h2>🎥 Videos</h2>
<p>0</p>
<button>Upload Videos</button>
</div>

<div class="card">
<h2>📷 Photos</h2>
<p>0</p>
<button>Upload Photos</button>
</div>

<div class="card">
<h2>🛒 Products</h2>
<p>0</p>
<button>Add Product</button>
</div>

<div class="card">
<h2>💳 Payments</h2>
<p>$0</p>
<button>View Payments</button>
</div>

<div class="card">
<h2>🎁 Gift Cards</h2>
<button>Create Gift Card</button>
</div>

<div class="card">
<h2>📅 Bookings</h2>
<button>View Bookings</button>
</div>

</div>

</body>
  </html>
