<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Page - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f2f5;
color:#222;
}

.top-header{
background:#0a4ea3;
color:white;
padding:18px;
text-align:center;
}

.top-header h1{
font-size:24px;
}

.top-header p{
margin-top:5px;
}

.business-page{
max-width:900px;
margin:20px auto 50px;
}

.cover{
height:220px;
background:linear-gradient(135deg,#0a4ea3,#1976d2);
border-radius:12px 12px 0 0;
}

.profile-area{
background:white;
padding:0 25px 25px;
border-radius:0 0 12px 12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
position:relative;
}

.profile-logo{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:6px solid white;
background:#eee;
position:relative;
margin-top:-85px;
display:block;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.business-name{
font-size:30px;
color:#0a4ea3;
margin-top:12px;
}

.business-category{
font-size:16px;
color:#666;
margin-top:7px;
}

.business-location{
font-size:16px;
color:#555;
margin-top:5px;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:18px;
}

.action-button{
border:none;
padding:11px 17px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
font-size:15px;
background:#0a4ea3;
color:white;
}

.action-button:hover{
background:#083d82;
}


/* =========================
   LOGIN / CHAT BUTTON
========================= */

.chat-login-button{
display:none;
background:#198754;
color:white;
}

.chat-login-button:hover{
background:#146c43;
}


/* =========================
   CONTENT
========================= */

.content{
margin-top:20px;
}

.section{
background:white;
border-radius:12px;
padding:22px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.section h2{
color:#0a4ea3;
margin-bottom:15px;
font-size:22px;
}

.info{
font-size:17px;
margin:12px 0;
line-height:1.5;
}

.info strong{
color:#333;
}


/* =========================
   POSTS
========================= */

.post{
border-top:1px solid #ddd;
padding-top:20px;
margin-top:20px;
}

.post:first-child{
border-top:none;
padding-top:0;
margin-top:0;
}

.post-header{
display:flex;
align-items:center;
gap:12px;
margin-bottom:12px;
}

.post-logo{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
border:2px solid #0a4ea3;
}

.post-name{
font-weight:bold;
color:#0a4ea3;
font-size:17px;
}

.post-date{
font-size:12px;
color:#777;
margin-top:3px;
}

.post-text{
font-size:17px;
line-height:1.5;
margin:10px 0;
white-space:pre-wrap;
}

.post img,
.post video{
width:100%;
max-height:600px;
object-fit:contain;
border-radius:10px;
margin-top:10px;
background:#000;
}

.post video{
display:block;
}

.no-posts{
text-align:center;
color:#777;
padding:20px;
}


/* =========================
   PHOTOS
========================= */

.photo-gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
}

.photo-gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
}


/* =========================
   IMAGE VIEWER
========================= */

.image-viewer{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
z-index:99999;
align-items:center;
justify-content:center;
padding:20px;
}

.image-viewer img{
max-width:96%;
max-height:90vh;
object-fit:contain;
border-radius:8px;
}

.close-viewer{
position:absolute;
top:15px;
right:20px;
color:white;
font-size:45px;
font-weight:bold;
cursor:pointer;
line-height:1;
}


/* =========================
   LOGIN MESSAGE
========================= */

.login-required{
display:none;
background:#eef5ff;
border-left:4px solid #0a4ea3;
padding:14px;
margin-top:15px;
border-radius:6px;
}

.login-required a{
color:#0a4ea3;
font-weight:bold;
}


/* =========================
   LOADING
========================= */

.loading{
text-align:center;
padding:50px;
font-size:20px;
color:#666;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

.business-page{
margin:10px;
}

.cover{
height:170px;
}

.profile-logo{
width:140px;
height:140px;
margin-top:-70px;
}

.business-name{
font-size:25px;
}

.profile-area{
padding:0 18px 20px;
}

.action-button{
padding:10px 13px;
font-size:14px;
}

.photo-gallery{
grid-template-columns:repeat(2,1fr);
}

.photo-gallery img{
height:160px;
}

}

</style>

</head>

<body>


<header class="top-header">

<h1>🌍 Logical World</h1>

<p>Connecting People, Products & Services.</p>

</header>


<main class="business-page">


<div id="loading" class="loading">
Loading page...
</div>


<div id="businessContent" style="display:none;">


<div class="cover"></div>


<div class="profile-area">


<img
id="businessLogo"
class="profile-logo"
src="images/default-logo.png"
alt="Page Logo"
title="Tap to view full size"
>


<h1
id="businessName"
class="business-name"
>
Page Name
</h1>


<p
id="businessCategory"
class="business-category"
>
</p>


<p
id="businessLocation"
class="business-location"
>
</p>


<!-- =========================
     ACTION BUTTONS
========================= -->

<div class="actions">


<a
id="whatsappBtn"
class="action-button"
href="#"
target="_blank"
style="display:none;"
>
💬 WhatsApp
</a>


<a
id="zangiBtn"
class="action-button"
href="#"
target="_blank"
style="display:none;"
>
💬 Zangi
</a>


<!-- CHAT BUTTON -->

<a
id="chatBtn"
class="action-button chat-login-button"
href="chat.html"
>
💬 Chat
</a>


<button
class="action-button"
onclick="shareBusiness()"
>
📤 Share
</button>


</div>


<!-- LOGIN MESSAGE -->

<div
id="loginRequired"
class="login-required"
>

🔐 <strong>Login required</strong> to use Chat.

<a href="login.html">
Login here
</a>

</div>


</div>


<div class="content">


<!-- =========================
     POSTS
========================= -->

<div class="section">

<h2>
📝 Posts
</h2>


<div id="postsList">

<p class="no-posts">
Loading posts...
</p>

</div>

</div>


<!-- =========================
     ABOUT
========================= -->

<div class="section">

<h2>
About This Page
</h2>


<p class="info">

<strong>Description:</strong><br>

<span id="description"></span>

</p>


<p class="info">

<strong>Location:</strong>

<span id="location"></span>

</p>


<p class="info">

<strong>Email:</strong>

<span id="email"></span>

</p>


<p class="info">

<strong>Business Address:</strong><br>

<span id="address"></span>

</p>

</div>


<!-- =========================
     PAGE PHOTOS
========================= -->

<div class="section">

<h2>
📸 Page Photos
</h2>


<div
id="photoGallery"
class="photo-gallery"
>
</div>


<p
id="noPhotos"
style="color:#666;"
>
No page photos available.
</p>

</div>


</div>

</div>

</main>


<!-- =========================
     FULL SIZE IMAGE
========================= -->

<div
id="imageViewer"
class="image-viewer"
onclick="closeImageViewer()"
>

<span
class="close-viewer"
onclick="closeImageViewer()"
>
&times;
</span>

<img
id="fullSizeImage"
src=""
alt="Full Size Image"
onclick="event.stopPropagation()"
>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
auth,
db
}
from "./firebase.js";


import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
doc,
getDoc,
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   GET PAGE ID
========================= */

const params =
new URLSearchParams(
window.location.search
);

const businessId =
params.get("id");


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById(
"loading"
);

const businessContent =
document.getElementById(
"businessContent"
);

const businessLogo =
document.getElementById(
"businessLogo"
);

const businessName =
document.getElementById(
"businessName"
);

const postsList =
document.getElementById(
"postsList"
);

const chatBtn =
document.getElementById(
"chatBtn"
);

const loginRequired =
document.getElementById(
"loginRequired"
);


/* =========================
   LOGIN / CHAT BUTTON
========================= */

onAuthStateChanged(
auth,
(user)=>{

if(user){

/*
Logged in:
show Chat button.
*/

chatBtn.style.display =
"inline-block";

loginRequired.style.display =
"none";

}else{

/*
Not logged in:
hide Chat button.
*/

chatBtn.style.display =
"none";

loginRequired.style.display =
"block";

}

});


/* =========================
   CHECK PAGE ID
========================= */

if(!businessId){

loading.innerText =
"No Page Selected.";

}else{

try{


/* =========================
   LOAD APPROVED PAGE
========================= */

const businessRef =
doc(
db,
"approvedPages",
businessId
);

const businessSnap =
await getDoc(
businessRef
);


if(!businessSnap.exists()){

loading.innerText =
"Page Not Found.";

}else{


const data =
businessSnap.data();


/* =========================
   PAGE NAME
========================= */

businessName.innerText =
data.pageName ||
"Page";


/* =========================
   CATEGORY
========================= */

document.getElementById(
"businessCategory"
).innerText =
data.category
?
"Category: " +
data.category
:
"";


/* =========================
   LOCATION
========================= */

document.getElementById(
"businessLocation"
).innerText =
data.location
?
"📍 " +
data.location
:
"";


/* =========================
   DESCRIPTION
========================= */

document.getElementById(
"description"
).innerText =
data.description ||
"No description available.";


/* =========================
   LOCATION
========================= */

document.getElementById(
"location"
).innerText =
data.location ||
"";


/* =========================
   EMAIL
========================= */

document.getElementById(
"email"
).innerText =
data.email ||
"";


/* =========================
   ADDRESS
========================= */

document.getElementById(
"address"
).innerText =
data.address ||
"";


/* =========================
   LOGO
========================= */

if(data.logoURL){

businessLogo.src =
data.logoURL;

}


/* =========================
   WHATSAPP
========================= */

const whatsappBtn =
document.getElementById(
"whatsappBtn"
);


if(
data.contactMethod === "whatsapp" &&
data.whatsapp
){

const number =
data.whatsapp.replace(
/\D/g,
""
);


whatsappBtn.href =
"https://wa.me/" +
number;

whatsappBtn.style.display =
"inline-block";

}


/* =========================
   ZANGI
========================= */

const zangiBtn =
document.getElementById(
"zangiBtn"
);


if(
data.contactMethod === "zangi" &&
data.zangi
){

zangiBtn.href =
"zangi://" +
encodeURIComponent(
data.zangi
);

zangiBtn.style.display =
"inline-block";

}


/* =========================
   PAGE PHOTOS
========================= */

const gallery =
document.getElementById(
"photoGallery"
);


if(
Array.isArray(data.photos) &&
data.photos.length > 0
){

document.getElementById(
"noPhotos"
).style.display =
"none";


data.photos.forEach(
(photoURL)=>{

const image =
document.createElement(
"img"
);

image.src =
photoURL;

image.alt =
"Page Photo";

image.onclick =
()=>{

openImageViewer(
photoURL
);

};

gallery.appendChild(
image
);

});

}


/* =========================
   LOAD POSTS
========================= */

await loadPosts(
businessId,
data
);


/* =========================
   SHOW PAGE
========================= */

loading.style.display =
"none";

businessContent.style.display =
"block";

}

}catch(error){

console.error(
"Page loading error:",
error
);

loading.innerText =
"Error loading page.";

}

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(
pageId,
pageData
){

postsList.innerHTML = `

<p class="no-posts">
Loading posts...
</p>

`;


try{

const postsRef =
collection(
db,
"posts"
);


const postsQuery =
query(

postsRef,

where(
"pageId",
"==",
pageId
)

);


const snapshot =
await getDocs(
postsQuery
);


if(snapshot.empty){

postsList.innerHTML = `

<p class="no-posts">
No posts yet.
</p>

`;

return;

}


/* =========================
   CONVERT POSTS
========================= */

const posts =
snapshot.docs.map(
(postDoc)=>({

id:
postDoc.id,

data:
postDoc.data()

})
);


/* =========================
   NEWEST FIRST
========================= */

posts.sort(
(a,b)=>{

const timeA =
getTime(
a.data.createdAt
);

const timeB =
getTime(
b.data.createdAt
);

return timeB - timeA;

});


/* =========================
   DISPLAY POSTS
========================= */

posts.forEach(
(post)=>{

const data =
post.data;


const postDiv =
document.createElement(
"div"
);

postDiv.className =
"post";


let mediaHTML = "";


/* IMAGE */

if(
data.mediaURL &&
data.mediaType === "image"
){

mediaHTML = `

<img
src="${escapeHTML(
data.mediaURL
)}"
alt="Post image"
onclick="openImageViewer('${escapeJS(
data.mediaURL
)}')"
>

`;

}


/* VIDEO */

if(
data.mediaURL &&
data.mediaType === "video"
){

mediaHTML = `

<video
src="${escapeHTML(
data.mediaURL
)}"
controls
playsinline
>

</video>

`;

}


/* POST HTML */

postDiv.innerHTML = `

<div class="post-header">

<img
class="post-logo"
src="${
escapeHTML(
data.logoURL ||
pageData.logoURL ||
"images/default-logo.png"
)
}"
alt="Page Logo"
>

<div>

<div class="post-name">

${
escapeHTML(
data.pageName ||
pageData.pageName ||
"Page"
)
}

</div>

<div class="post-date">

${formatDate(
data.createdAt
)}

</div>

</div>

</div>


${
data.text
?
`

<div class="post-text">

${escapeHTML(
data.text
)}

</div>

`
:
""
}


${mediaHTML}

`;


postsList.appendChild(
postDiv
);

});


}catch(error){

console.error(
"Posts loading error:",
error
);


postsList.innerHTML = `

<p class="no-posts">

Unable to load posts.

</p>

`;

}

}


/* =========================
   GET TIMESTAMP
========================= */

function getTime(
timestamp
){

if(
timestamp &&
typeof timestamp.toMillis ===
"function"
){

return timestamp.toMillis();

}

return 0;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(
timestamp
){

if(
!timestamp ||
typeof timestamp.toDate !==
"function"
){

return "";

}

return timestamp
.toDate()
.toLocaleString();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
value
){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================
   ESCAPE JAVASCRIPT
========================= */

function escapeJS(
value
){

return String(value)

.replace(
/\\/g,
"\\\\"
)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
"&quot;"
);

}


/* =========================
   IMAGE VIEWER
========================= */

function openImageViewer(
imageURL
){

document.getElementById(
"fullSizeImage"
).src =
imageURL;


document.getElementById(
"imageViewer"
).style.display =
"flex";

}


function closeImageViewer(){

document.getElementById(
"imageViewer"
).style.display =
"none";


document.getElementById(
"fullSizeImage"
).src =
"";

}


window.openImageViewer =
openImageViewer;

window.closeImageViewer =
closeImageViewer;


/* =========================
   SHARE
========================= */

async function shareBusiness(){

const shareData = {

title:
document.getElementById(
"businessName"
).innerText,

text:
"Check out this page on Logical World.",

url:
window.location.href

};


try{

if(navigator.share){

await navigator.share(
shareData
);

}else{

await navigator.clipboard.writeText(
window.location.href
);

alert(
"Page link copied!"
);

}

}catch(error){

console.log(
"Share cancelled."
);

}

}


window.shareBusiness =
shareBusiness;

</script>


</body>

   </html>
