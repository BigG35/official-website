<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Details - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;

}

body{

}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1000px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

.logo{
width:180px;
height:180px;
display:block;
margin:auto;
border-radius:50%;
object-fit:cover;
}

h1{
text-align:center;
margin:20px 0;
color:#0a4ea3;
}

.info{
margin:12px 0;
font-size:18px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

}

.gallery img{
width:100%;
border-radius:10px;
}

.button{
display:inline-block;
padding:12px 20px;
margin:10px 5px;
background:#0a4ea3;
color:white;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

.button:hover{
background:#083d82;
}

</style>

</head>

</html>
