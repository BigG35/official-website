<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Details - Logical World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1000px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

.logo{
width:180px;
height:180px;
display:block;
margin:auto;
border-radius:50%;
object-fit:cover;
cursor:pointer;
transition:transform .2s;
}

.logo:active{
transform:scale(.96);
}

h1{
text-align:center;
margin:20px 0;
color:#0a4ea3;
}

.info{
margin:12px 0;
font-size:18px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.gallery img{
width:100%;
border-radius:10px;
cursor:pointer;
}

.button{
display:inline-block;
padding:12px 20px;
margin:10px 5px;
background:#0a4ea3;
color:white;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

.button:hover{
background:#083d82;
}


/* FULL SIZE LOGO VIEWER */

.logo-viewer{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:99999;
align-items:center;
justify-content:center;
padding:20px;
}

.logo-viewer img{
max-width:95%;
max-height:90vh;
object-fit:contain;
border-radius:10px;
}

.close-logo{
position:absolute;
top:15px;
right:20px;
color:white;
font-size:42px;
font-weight:bold;
cursor:pointer;
z-index:100000;
}

</style>

</head>

<body>


<header>

<h1>Logical World</h1>

<p>Business Details</p>

</header>


<div class="container">

<img
id="businessLogo"
class="logo"
src="images/default-logo.png"
alt="Business Logo"
title="Tap to view full size"
>

<h1 id="businessName">Loading...</h1>


<p class="info">
<strong>Category:</strong>
<span id="category"></span>
</p>


<p class="info">
<strong>Description:</strong>
<span id="description"></span>
</p>


<p class="info">
<strong>Location:</strong>
<span id="location"></span>
</p>


<p class="info">
<strong>Phone:</strong>
<span id="phone"></span>
</p>


<p class="info">
<strong>Email:</strong>
<span id="email"></span>
</p>


<p class="info">
<strong>Business Address:</strong>
<span id="address"></span>
</p>


<h2>Business Photos</h2>

<div id="photoGallery" class="gallery"></div>


<div style="margin-top:25px;text-align:center;">

<a
href="#"
id="whatsappBtn"
class="button"
>
💬 WhatsApp
</a>

<a
href="#"
class="button"
>
❤️ Like
</a>

<a
href="#"
class="button"
>
⭐ Review
</a>

<a
href="#"
class="button"
>
📤 Share
</a>

</div>

</div>


<!-- FULL SIZE LOGO -->

<div
id="logoViewer"
class="logo-viewer"
onclick="closeLogoViewer()"
>

<span
class="close-logo"
onclick="closeLogoViewer()"
>
&times;
</span>

<img
id="fullLogo"
src=""
alt="Full Size Business Logo"
onclick="event.stopPropagation()"
>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");


const businessName =
document.getElementById("businessName");

const logo =
document.getElementById("businessLogo");


/* LOAD BUSINESS */

if(!id){

businessName.innerText =
"No Business Selected";

}else{

try{

const docRef =
doc(db,"approvedPages",id);

const docSnap =
await getDoc(docRef);


if(!docSnap.exists()){

businessName.innerText =
"Business Not Found";

}else{

const data =
docSnap.data();


/* BUSINESS NAME */

businessName.innerText =
data.pageName || "";


/* BUSINESS INFORMATION */

document.getElementById("category").innerText =
data.category || "";


document.getElementById("description").innerText =
data.description || "";


document.getElementById("location").innerText =
data.location || "";


document.getElementById("phone").innerText =
data.phone || "";


document.getElementById("email").innerText =
data.email || "";


document.getElementById("address").innerText =
data.address || "";


/* BUSINESS LOGO */

if(data.logoURL){

logo.src =
data.logoURL;

}


/* WHATSAPP */

if(data.phone){

document.getElementById("whatsappBtn").href =
"https://wa.me/" +
data.phone.replace(/\D/g,"");

}


/* BUSINESS PHOTOS */

if(data.photos && Array.isArray(data.photos)){

const gallery =
document.getElementById("photoGallery");

data.photos.forEach(function(photo){

const image =
document.createElement("img");

image.src =
photo;

image.alt =
"Business Photo";

gallery.appendChild(image);

});

}

}

}catch(error){

console.error(
"Business loading error:",
error
);

businessName.innerText =
"Error loading business";

}

}


/* FULL SIZE LOGO */

logo.addEventListener(
"click",
function(){

const viewer =
document.getElementById("logoViewer");

const fullLogo =
document.getElementById("fullLogo");


fullLogo.src =
logo.src;


viewer.style.display =
"flex";

}
);


/* CLOSE LOGO */

function closeLogoViewer(){

const viewer =
document.getElementById("logoViewer");

const fullLogo =
document.getElementById("fullLogo");


viewer.style.display =
"none";

fullLogo.src =
"";

}


/* MAKE FUNCTION AVAILABLE */

window.closeLogoViewer =
closeLogoViewer;

</script>


</body>

</html>
