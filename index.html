<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Logical World - Videos</title>

<style>

/* =========================
   BASIC
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#333;
line-height:1.6;
}


/* =========================
   HEADER
========================= */

header{
background:#0a4ea3;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:40px;
}

header p{
font-size:18px;
margin-top:8px;
}


/* =========================
   NAVIGATION
========================= */

nav{
background:#222;

display:flex;

justify-content:center;

flex-wrap:wrap;

padding:15px;
}

nav a{
color:white;

text-decoration:none;

padding:10px 15px;

font-weight:bold;
}

nav a:hover{
background:#0a4ea3;

border-radius:5px;
}


/* =========================
   PAGE TITLE
========================= */

.page-title{
text-align:center;

padding:40px 20px 20px;
}

.page-title h2{
font-size:34px;

color:#0a4ea3;
}

.page-title p{
margin-top:8px;

color:#666;

font-size:16px;
}


/* =========================
   VIDEO CONTAINER
========================= */

.videos-container{

max-width:1200px;

margin:auto;

padding:20px;
}


/* =========================
   VIDEO CARD
========================= */

.video-card{

background:white;

border-radius:12px;

box-shadow:
0 2px 10px rgba(0,0,0,.15);

margin-bottom:30px;

overflow:hidden;
}


/* =========================
   VIDEO AREA
========================= */

.video-area{

width:100%;

background:#000;

display:flex;

justify-content:center;

align-items:center;
}


/*
   IMPORTANT:

   We do NOT give the video
   a fixed height.

   The video's natural aspect
   ratio is preserved.
*/

.video-player{

display:block;

width:auto;

height:auto;

max-width:100%;

background:#000;
}


/*
   This allows videos to display
   at their natural size while
   preventing them from becoming
   wider than the phone/screen.
*/

.video-player{

max-height:none;
}


/* =========================
   VIDEO INFORMATION
========================= */

.video-info{

padding:20px;
}

.video-title{

font-size:24px;

font-weight:bold;

color:#0a4ea3;

margin-bottom:10px;
}

.video-description{

font-size:16px;

white-space:pre-wrap;

color:#444;

margin-bottom:12px;
}


/* =========================
   DATE
========================= */

.video-date{

font-size:13px;

color:#777;
}


/* =========================
   LOADING
========================= */

.loading{

text-align:center;

padding:40px;

color:#666;

font-size:18px;
}


/* =========================
   NO VIDEOS
========================= */

.no-videos{

background:white;

padding:40px;

text-align:center;

border-radius:10px;

box-shadow:
0 2px 10px rgba(0,0,0,.10);

color:#777;

font-size:17px;
}


/* =========================
   ERROR
========================= */

.error{

background:#f8d7da;

color:#842029;

padding:25px;

border-radius:10px;

text-align:center;

margin:20px 0;
}


/* =========================
   FOOTER
========================= */

footer{

background:#0a4ea3;

color:white;

text-align:center;

padding:25px;

margin-top:50px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

header h1{
font-size:30px;
}

header p{
font-size:16px;
}

.page-title h2{
font-size:28px;
}

.videos-container{
padding:10px;
}

.video-card{
border-radius:8px;
}

.video-info{
padding:15px;
}

.video-title{
font-size:20px;
}

/*
   On small screens the video
   will shrink only when necessary
   to fit the screen.
*/

.video-player{
max-width:100%;
width:auto;
height:auto;
}

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<h1>
🌍 Logical World
</h1>

<p>
Connecting People, Products & Services.
</p>

</header>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

<a href="index.html">
🏠 Home
</a>

<a href="gallery.html">
📸 Gallery
</a>

<a href="videos.html">
🎥 Videos
</a>

<a href="marketplace.html">
🛒 Marketplace
</a>

<a href="services.html">
🏠 Services
</a>

<a href="contact.html">
📞 Contact
</a>

<a href="login.html">
🔐 Login
</a>

</nav>


<!-- =========================
     TITLE
========================= -->

<div class="page-title">

<h2>
🎥 Videos
</h2>

<p>
Watch videos uploaded to Logical World.
</p>

</div>


<!-- =========================
     VIDEOS
========================= -->

<section>

<div
id="videosContainer"
class="videos-container"
>

<div class="loading">

Loading videos...

</div>

</div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer>

<h3>
🌍 Logical World
</h3>

<p>
Connecting People, Products & Services.
</p>

<br>

<p>
© 2026 Logical World. All Rights Reserved.
</p>

</footer>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">


/* =========================
   FIREBASE
========================= */

import {
db
}
from "./firebase.js";


import {
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   ELEMENT
========================= */

const videosContainer =
document.getElementById(
"videosContainer"
);


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

try{

videosContainer.innerHTML = `

<div class="loading">

Loading videos...

</div>

`;


/* =========================
   GET SITE VIDEOS
========================= */

const snapshot =
await getDocs(
collection(
db,
"siteVideos"
)
);


/* =========================
   CHECK
========================= */

if(
snapshot.empty
){

videosContainer.innerHTML = `

<div class="no-videos">

🎥 No videos have been uploaded yet.

</div>

`;

return;

}


/* =========================
   CONVERT DATA
========================= */

const videos =
snapshot.docs.map(
docSnap => ({

id:
docSnap.id,

data:
docSnap.data()

})
);


/* =========================
   SORT NEWEST FIRST
========================= */

videos.sort(
(a,b)=>
getTime(
b.data.createdAt
)
-
getTime(
a.data.createdAt
)
);


/* =========================
   DISPLAY
========================= */

videosContainer.innerHTML = "";


videos.forEach(
video=>{

const data =
video.data;


/*
   Support the normal field
   used by the admin uploader.
*/

const videoURL =
data.videoURL ||
data.videoUrl ||
data.url ||
data.mediaURL ||
"";


const title =
data.title ||
"Untitled Video";


const description =
data.description ||
data.desc ||
"";


/* =========================
   SKIP BROKEN VIDEO
========================= */

if(!videoURL){

console.warn(
"Video has no video URL:",
video.id,
data
);

return;

}


/* =========================
   CARD
========================= */

const card =
document.createElement(
"div"
);

card.className =
"video-card";


/* =========================
   VIDEO AREA
========================= */

const videoArea =
document.createElement(
"div"
);

videoArea.className =
"video-area";


/* =========================
   VIDEO
========================= */

const videoElement =
document.createElement(
"video"
);

videoElement.className =
"video-player";

videoElement.controls =
true;

videoElement.playsInline =
true;

videoElement.preload =
"metadata";

videoElement.src =
videoURL;


/*
   IMPORTANT:

   We allow the browser to use
   the video's real dimensions.

   We are NOT forcing:
   height:400px
   height:500px
   aspect-ratio:16/9
   object-fit:cover

   Therefore the original video
   shape is preserved.
*/


videoElement.addEventListener(
"loadedmetadata",
()=>{

console.log(
"Video dimensions:",
videoElement.videoWidth,
"x",
videoElement.videoHeight
);

}
);


videoElement.addEventListener(
"error",
()=>{

console.error(
"Unable to play video:",
videoURL
);

}
);


videoArea.appendChild(
videoElement
);


/* =========================
   VIDEO INFORMATION
========================= */

const info =
document.createElement(
"div"
);

info.className =
"video-info";


let infoHTML = `

<h3 class="video-title">

${escapeHTML(
title
)}

</h3>

`;


if(description){

infoHTML += `

<p class="video-description">

${escapeHTML(
description
)}

</p>

`;

}


infoHTML += `

<div class="video-date">

${infoHTML += `

<div class="video-date">

${formatDate(
data.createdAt
)}

</div>

`;


info.innerHTML =
infoHTML;


/* =========================
   ADD TO CARD
========================= */

card.appendChild(
videoArea
);

card.appendChild(
info
);


/* =========================
   ADD TO PAGE
========================= */

videosContainer.appendChild(
card
);

});


/* =========================
   IF NO VALID VIDEOS
========================= */

if(
videosContainer.children.length === 0
){

videosContainer.innerHTML = `

<div class="no-videos">

🎥 No playable videos found.

</div>

`;

}


}catch(error){

console.error(
"Video loading error:",
error
);


videosContainer.innerHTML = `

<div class="error">

<strong>
Unable to load videos.
</strong>

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

}


/* =========================
   TIME
========================= */

function getTime(
timestamp
){

if(
timestamp &&
typeof timestamp.toMillis ===
"function"
){

return timestamp.toMillis();

}

return 0;

}


/* =========================
   DATE
========================= */

function formatDate(
timestamp
){

if(
!timestamp ||
typeof timestamp.toDate !==
"function"
){

return "";

}


return timestamp
.toDate()
.toLocaleString();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
value
){

return String(
value
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================
   START
========================= */

loadVideos();


</script>


</body>

</html>
